<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanhunt | Experimental Lab</title>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --neon-blue:#3b82f6; --neon-orange:#f97316; --bg-dark:#020617; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg-dark); color:#fff; overflow:hidden; }
    button { font:inherit; border:0; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .page { display:none !important; }
    .page.active { display:flex !important; }
    #page-scan.active, #page-result.active { display:block !important; }
    .glass { background:rgba(15,23,42,.82); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.1); }
    .home { height:100dvh; flex-direction:column; align-items:center; justify-content:center; padding:2rem; text-align:center; background:linear-gradient(#0f172a,#000); }
    .logo { width:5rem; height:5rem; border-radius:2rem; background:#2563eb; display:flex; align-items:center; justify-content:center; font-size:1.75rem; font-weight:900; font-style:italic; margin-bottom:1.5rem; box-shadow:0 0 50px rgba(59,130,246,.3); }
    h1 { margin:0 0 .5rem; font-size:3rem; font-weight:900; font-style:italic; letter-spacing:-.06em; }
    .version { color:#3b82f6; font:500 .625rem 'JetBrains Mono',monospace; letter-spacing:.3em; text-transform:uppercase; margin-bottom:3rem; }
    .home-actions { width:100%; max-width:20rem; }
    .primary { width:100%; padding:1.2rem; border-radius:1rem; background:#fff; color:#000; font-size:1.2rem; font-weight:900; box-shadow:0 18px 30px rgba(0,0,0,.3); }
    .primary:active, .blue-button:active { transform:scale(.97); }
    .metrics { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:1rem; }
    .metric { padding:1rem; border-radius:1rem; text-align:left; }
    .metric-label { margin:0; color:#64748b; font-size:.58rem; font-weight:700; text-transform:uppercase; }
    .metric-value { margin:.25rem 0 0; font-size:1.05rem; font-weight:900; font-style:italic; }
    #page-scan { height:100dvh; background:#000; position:relative; }
    .guide-wrap { position:absolute; top:max(1rem,env(safe-area-inset-top)); width:100%; z-index:30; padding:1rem 2rem; text-align:center; pointer-events:none; }
    .guide { display:inline-block; padding:.55rem 1.2rem; border-radius:999px; }
    #guide-text { font-size:.65rem; font-weight:900; letter-spacing:.2em; text-transform:uppercase; color:#60a5fa; }
    #camera-status { margin:.5rem auto 0; max-width:26rem; min-height:1.25rem; color:#cbd5e1; font-size:.75rem; line-height:1.35; }
    #camera-status.error { color:#fca5a5; }
    .camera-stage { height:70dvh; width:100%; padding:6rem 1.5rem 1.5rem; perspective:1200px; }
    .flip-card { position:relative; width:100%; height:100%; transition:transform .8s cubic-bezier(.175,.885,.32,1.275); transform-style:preserve-3d; }
    .flip-card.flipped { transform:rotateY(180deg); }
    .camera-face { position:absolute; inset:0; border-radius:3rem; overflow:hidden; background:#0f172a; backface-visibility:hidden; border:2px solid rgba(59,130,246,.35); }
    .camera-face.back { transform:rotateY(180deg); border-color:rgba(249,115,22,.35); }
    video { width:100%; height:100%; object-fit:cover; }
    .camera-face.front video { filter:grayscale(.2); }
    .camera-face.back video { opacity:.78; }
    .scan-line { height:2px; background:linear-gradient(to right,transparent,var(--neon-blue),transparent); position:absolute; width:100%; top:20%; animation:scan 2s infinite; z-index:20; }
    @keyframes scan { 0%{top:20%;opacity:0} 50%{opacity:1} 100%{top:80%;opacity:0} }
    .scan-controls { position:absolute; bottom:max(1.5rem,env(safe-area-inset-bottom)); width:100%; display:flex; flex-direction:column; align-items:center; gap:1rem; }
    #shutter { position:relative; width:5rem; height:5rem; border-radius:999px; background:#fff; display:flex; align-items:center; justify-content:center; padding:.5rem; box-shadow:0 0 30px rgba(255,255,255,.25); }
    #shutter.back-step { background:#f97316; }
    #shutter::after { content:''; width:100%; height:100%; border:4px solid rgba(0,0,0,.12); border-radius:999px; }
    .abort { background:transparent; color:#94a3b8; font-size:.65rem; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    #page-result { height:100dvh; background:#020617; overflow-y:auto; }
    .result-inner { padding:4rem 2rem 8rem; max-width:34rem; margin:0 auto; }
    .result-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .result-label { background:#2563eb; padding:.35rem .75rem; border-radius:.35rem; font-size:.65rem; font-weight:900; letter-spacing:.08em; }
    .done { background:transparent; color:#94a3b8; font-size:.75rem; font-weight:900; }
    .card { padding:2rem; border-radius:2.5rem; margin-bottom:1rem; }
    .validated { margin:0 0 .5rem; color:#3b82f6; font-size:.65rem; font-weight:900; letter-spacing:.2em; text-transform:uppercase; }
    #res-name { margin:0 0 1.5rem; font-size:2.25rem; line-height:1.05; font-weight:900; font-style:italic; letter-spacing:-.04em; }
    .cook { background:#ea580c; padding:1.5rem; border-radius:2rem; }
    .cook-head { display:flex; justify-content:space-between; opacity:.7; font-size:.65rem; font-weight:900; text-transform:uppercase; }
    #res-time { margin:.5rem 0 0; font-size:1.85rem; font-weight:900; font-style:italic; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
    .detail { padding:1.25rem; border-radius:2rem; }
    .detail p:first-child, .allergen-title { margin:0 0 .5rem; color:#64748b; font-size:.58rem; font-weight:900; text-transform:uppercase; }
    .detail p:last-child { margin:0; font:700 .75rem 'JetBrains Mono',monospace; }
    #res-jan { color:#60a5fa; }
    #res-allergens { display:flex; flex-wrap:wrap; gap:.5rem; }
    .allergen { background:rgba(127,29,29,.45); color:#f87171; border:1px solid rgba(239,68,68,.3); padding:.3rem .7rem; border-radius:999px; font-size:.6rem; font-weight:900; text-transform:uppercase; }
    .result-footer { position:fixed; bottom:0; left:0; width:100%; padding:1.5rem; padding-bottom:max(1.5rem,env(safe-area-inset-bottom)); background:linear-gradient(transparent,#020617 35%); }
    .blue-button { width:100%; max-width:34rem; display:block; margin:0 auto; padding:1.15rem; border-radius:1rem; background:#2563eb; color:#fff; font-size:1.05rem; font-weight:900; }
    #fatal-error { position:fixed; z-index:100; left:1rem; right:1rem; bottom:1rem; display:none; background:#7f1d1d; color:#fff; border:1px solid #f87171; border-radius:.75rem; padding:.85rem; font-size:.75rem; white-space:pre-wrap; }
  </style>
</head>
<body>
  <main>
    <section id="page-home" class="page home active" aria-label="ホーム">
      <div class="logo">SH</div>
      <h1>SCANHUNT</h1>
      <p id="app-version" class="version">Experimental Lab</p>
      <div class="home-actions">
        <button id="new-scan-button" type="button" class="primary">NEW SCAN</button>
        <div class="metrics">
          <div class="metric glass"><p class="metric-label">My Items</p><p class="metric-value">24</p></div>
          <div class="metric glass"><p class="metric-label" style="color:#3b82f6">Contribution</p><p class="metric-value" style="color:#60a5fa">B2B OK</p></div>
        </div>
      </div>
    </section>

    <section id="page-scan" class="page" aria-label="スキャン">
      <div class="guide-wrap">
        <div class="guide glass"><span id="guide-text">Step 1: Front (Product Identity)</span></div>
        <p id="camera-status" role="status" aria-live="polite"></p>
      </div>
      <div class="camera-stage">
        <div id="flip-container" class="flip-card">
          <div class="camera-face front"><video id="v1" autoplay muted playsinline></video><div class="scan-line"></div></div>
          <div class="camera-face back"><video id="v2" autoplay muted playsinline></video></div>
        </div>
      </div>
      <div class="scan-controls">
        <button id="shutter" type="button" disabled aria-label="撮影"></button>
        <button id="abort-button" type="button" class="abort">Abort Mission</button>
      </div>
    </section>

    <section id="page-result" class="page" aria-label="解析結果">
      <div class="result-inner">
        <div class="result-head"><div class="result-label">AI ANALYSIS RESULT</div><button id="done-button" type="button" class="done">DONE</button></div>
        <div class="card glass">
          <p class="validated">Validated Product</p>
          <h2 id="res-name">海鮮ちゃんぽん</h2>
          <div class="cook"><div class="cook-head"><span id="res-cook-label">Microwave Instructions</span><span id="res-cook-unit">500W</span></div><p id="res-time">5分30秒</p></div>
        </div>
        <div class="detail-grid">
          <div class="detail glass"><p>GTIN / JAN</p><p id="res-jan">4902105109885</p></div>
          <div class="detail glass"><p>Health Log</p><p id="res-cal">452 kcal</p></div>
        </div>
        <div class="card glass"><p class="allergen-title">Allergens Detected</p><div id="res-allergens"></div></div>
      </div>
      <div class="result-footer"><button id="scan-next-button" type="button" class="blue-button">SCAN NEXT ITEM</button></div>
    </section>
  </main>
  <div id="fatal-error" role="alert"></div>

  <script>
  (function () {
    'use strict';

    var APP_VERSION = '0.3.4';
    var GEMINI_MODEL = 'gemini-flash-latest';
    var GEMINI_API_KEY_STORAGE_KEY = 'scanhunt_gemini_api_key';
    var GEMINI_MAX_ATTEMPTS = 3;
    var GEMINI_RETRY_BASE_DELAY_MS = 1000;
    var GEMINI_REQUEST_TIMEOUT_MS = 25000;

    var currentStep = 'FRONT';
    var capturedFront = null;
    var capturedBack = null;
    var currentStream = null;
    var cameraGeneration = 0;
    var scanGeneration = 0;
    var activeAbortController = null;
    var retryTimer = null;

    var state = {
      FRONT: { text:'Step 1: Front (Product Identity)', color:'#60a5fa' },
      BACK: { text:'Step 2: Back (Nutrition/JAN)', color:'#fb923c' }
    };

    var GEMINI_RESPONSE_SCHEMA = {
      type:'OBJECT',
      properties:{
        gtin_jan:{type:'STRING'}, product_name:{type:'STRING'}, brand:{type:'STRING'}, category:{type:'STRING'}, temperature_zone:{type:'STRING'},
        cooking_instructions:{type:'OBJECT',properties:{microwave:{type:'OBJECT',properties:{wattage_500w:{type:'STRING'},wattage_600w:{type:'STRING'}}},pan_fry:{type:'STRING'},other_notes:{type:'STRING'}}},
        nutrition:{type:'OBJECT',properties:{calories_kcal:{type:'NUMBER'},protein_g:{type:'NUMBER'},fat_g:{type:'NUMBER'},carbs_g:{type:'NUMBER'}}},
        allergens:{type:'ARRAY',items:{type:'STRING'}}
      },
      required:['product_name']
    };

    var MOCK_RESULT = {
      product_name:'極旨！海鮮ちゃんぽん', gtin_jan:'4902105109885',
      cooking_instructions:{microwave:{wattage_500w:'5分30秒'}}, nutrition:{calories_kcal:452},
      allergens:['小麦','卵','乳','えび','大豆']
    };

    function byId(id) { return document.getElementById(id); }

    function showFatal(message) {
      var box = byId('fatal-error');
      if (!box) return;
      box.textContent = 'Scanhunt error: ' + message;
      box.style.display = 'block';
    }

    window.addEventListener('error', function (event) {
      showFatal(event.message || 'JavaScript initialization failed');
    });
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      showFatal(reason && reason.message ? reason.message : String(reason || 'Unhandled promise rejection'));
    });

    function setCameraStatus(message, isError) {
      var el = byId('camera-status');
      el.textContent = message || '';
      el.className = isError ? 'error' : '';
    }

    function navigateTo(pageId) {
      var pages = document.querySelectorAll('.page');
      var i;
      var target = byId('page-' + pageId);
      if (!target) throw new Error('Unknown page: ' + pageId);

      stopCamera();
      if (pageId === 'home' || pageId === 'scan') cancelActiveAnalysis();

      for (i = 0; i < pages.length; i += 1) pages[i].classList.remove('active');
      target.classList.add('active');

      if (pageId === 'scan') {
        resetScan();
        initCamera();
      }
    }

    function cancelActiveAnalysis() {
      scanGeneration += 1;
      if (activeAbortController) activeAbortController.abort();
      activeAbortController = null;
      if (retryTimer !== null) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function cameraReady(video) {
      return Boolean(video && video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2);
    }

    function updateShutterAvailability() {
      var ready = cameraReady(byId('v1'));
      byId('shutter').disabled = !ready;
      if (ready) setCameraStatus('カメラ準備完了', false);
    }

    function stopStream(stream) {
      if (!stream) return;
      stream.getTracks().forEach(function (track) { track.stop(); });
    }

    function attachStream(video, stream) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        function cleanup() {
          video.removeEventListener('loadeddata', onReady);
          video.removeEventListener('canplay', onReady);
          video.removeEventListener('error', onError);
        }
        function onReady() {
          if (settled || !cameraReady(video)) return;
          settled = true;
          cleanup();
          resolve();
        }
        function onError() {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('カメラ映像を再生できませんでした'));
        }
        video.addEventListener('loadeddata', onReady);
        video.addEventListener('canplay', onReady);
        video.addEventListener('error', onError);
        video.srcObject = stream;
        var playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function (error) {
            console.error('video.play failed', error);
            onError();
          });
        }
        if (cameraReady(video)) onReady();
      });
    }

    async function initCamera() {
      var stream;
      var myCameraGeneration = cameraGeneration + 1;
      cameraGeneration = myCameraGeneration;
      byId('shutter').disabled = true;
      setCameraStatus('カメラを起動しています…', false);

      if (!window.isSecureContext) {
        setCameraStatus('カメラはHTTPS接続でのみ利用できます。', true);
        return;
      }
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        setCameraStatus('このブラウザではカメラAPIを利用できません。Chromeで開いてください。', true);
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1080}},audio:false});
        if (myCameraGeneration !== cameraGeneration || !byId('page-scan').classList.contains('active')) {
          stopStream(stream);
          return;
        }
        currentStream = stream;
        await Promise.all([attachStream(byId('v1'), stream), attachStream(byId('v2'), stream)]);
        if (myCameraGeneration !== cameraGeneration || currentStream !== stream || !byId('page-scan').classList.contains('active')) {
          if (currentStream === stream) currentStream = null;
          stopStream(stream);
          return;
        }
        updateShutterAvailability();
      } catch (error) {
        if (myCameraGeneration !== cameraGeneration) {
          stopStream(stream);
          return;
        }
        console.error('initCamera failed', error);
        stopCamera();
        var name = error && error.name ? error.name : '';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          setCameraStatus('カメラ権限が拒否されています。Chromeのサイト設定でカメラを許可してください。', true);
        } else {
          setCameraStatus('カメラを起動できませんでした。ページを再読み込みしてください。', true);
        }
      }
    }

    function stopCamera() {
      cameraGeneration += 1;
      if (currentStream) {
        stopStream(currentStream);
        currentStream = null;
      }
      ['v1','v2'].forEach(function (id) {
        var video = byId(id);
        if (video) video.srcObject = null;
      });
      var shutter = byId('shutter');
      if (shutter) shutter.disabled = true;
    }

    function captureFrame(video) {
      var canvas;
      var context;
      if (!cameraReady(video)) return null;
      canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      try {
        context = canvas.getContext('2d');
        if (!context) return null;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', .85).split(',')[1] || null;
      } catch (error) {
        console.error('captureFrame failed', error);
        return null;
      }
    }

    function handleCapture() {
      var frame = captureFrame(byId('v1'));
      if (!frame) {
        setCameraStatus('映像がまだ準備できていません。少し待ってから再度お試しください。', true);
        updateShutterAvailability();
        return;
      }
      if (navigator.vibrate) navigator.vibrate(60);
      if (currentStep === 'FRONT') {
        capturedFront = frame;
        currentStep = 'BACK';
        byId('flip-container').classList.add('flipped');
        updateUI();
      } else {
        capturedBack = frame;
        byId('shutter').disabled = true;
        setCameraStatus('AI解析中…', false);
        processAI();
      }
    }

    function updateUI() {
      var current = state[currentStep];
      byId('guide-text').textContent = current.text;
      byId('guide-text').style.color = current.color;
      byId('shutter').classList.toggle('back-step', currentStep === 'BACK');
    }

    function getApiKey() {
      var key = '';
      try { key = localStorage.getItem(GEMINI_API_KEY_STORAGE_KEY) || ''; } catch (error) { console.warn('localStorage unavailable', error); }
      if (!key) {
        key = window.prompt('Gemini APIキーを入力してください（このブラウザにのみ保存。未入力ならモックデータで進みます）') || '';
        if (key) {
          try { localStorage.setItem(GEMINI_API_KEY_STORAGE_KEY, key); } catch (error) { console.warn('API key could not be stored', error); }
        }
      }
      return key;
    }

    function isResultSubstantial(data) {
      var cooking = data && data.cooking_instructions;
      var microwave = cooking && cooking.microwave;
      var nutrition = data && data.nutrition;
      var hasCooking = Boolean(cooking && ((microwave && (microwave.wattage_500w || microwave.wattage_600w)) || cooking.pan_fry));
      var hasNutrition = Boolean(nutrition && Object.keys(nutrition).length > 0);
      var hasAllergens = Boolean(data && Array.isArray(data.allergens) && data.allergens.length > 0);
      return hasCooking || hasNutrition || hasAllergens;
    }

    function abortableDelay(ms, controller) {
      return new Promise(function (resolve, reject) {
        function onAbort() {
          if (retryTimer !== null) clearTimeout(retryTimer);
          retryTimer = null;
          reject(Object.assign(new Error('スキャンが中止されました'), {retryable:false}));
        }
        retryTimer = setTimeout(function () {
          retryTimer = null;
          if (controller) controller.signal.removeEventListener('abort', onAbort);
          resolve();
        }, ms);
        if (controller) {
          if (controller.signal.aborted) return onAbort();
          controller.signal.addEventListener('abort', onAbort, {once:true});
        }
      });
    }

    async function callGeminiOnce(frontBase64, backBase64, apiKey, externalController) {
      var controller = new AbortController();
      var timeoutId = setTimeout(function () { controller.abort(); }, GEMINI_REQUEST_TIMEOUT_MS);
      var onExternalAbort = function () { controller.abort(); };
      var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(GEMINI_MODEL) + ':generateContent?key=' + encodeURIComponent(apiKey);
      var body = {
        contents:[{parts:[
          {text:'これは食品パッケージの表面と裏面の写真です。1枚目が表面、2枚目が裏面です。指定されたJSON Schemaに従って、商品名・JANコード・電子レンジ調理手順・栄養成分・アレルギー物質を抽出してください。読み取れない項目は省略してください。'},
          {inline_data:{mime_type:'image/jpeg',data:frontBase64}},
          {inline_data:{mime_type:'image/jpeg',data:backBase64}}
        ]}],
        generationConfig:{responseMimeType:'application/json',responseSchema:GEMINI_RESPONSE_SCHEMA}
      };
      var response;
      var payload;
      var candidate;
      var text;
      var parsed;

      if (externalController) externalController.signal.addEventListener('abort', onExternalAbort);
      try {
        response = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
      } catch (error) {
        if (externalController && externalController.signal.aborted) throw Object.assign(new Error('スキャンが中止されました'), {retryable:false});
        throw Object.assign(new Error('Gemini APIへの通信に失敗しました（タイムアウトまたはネットワークエラー）'), {retryable:true});
      } finally {
        clearTimeout(timeoutId);
        if (externalController) externalController.signal.removeEventListener('abort', onExternalAbort);
      }

      if (!response.ok) {
        if (response.status === 400 || response.status === 401 || response.status === 403) {
          try { localStorage.removeItem(GEMINI_API_KEY_STORAGE_KEY); } catch (error) {}
        }
        text = await response.text();
        throw Object.assign(new Error('Gemini API error ' + response.status + ': ' + text), {retryable:response.status === 429 || response.status >= 500});
      }

      payload = await response.json();
      candidate = payload.candidates && payload.candidates[0];
      text = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;
      if (!text) throw Object.assign(new Error('Gemini APIから抽出結果が得られませんでした'), {retryable:true});
      if (candidate.finishReason && candidate.finishReason !== 'STOP') throw Object.assign(new Error('Gemini APIの応答が不完全です (' + candidate.finishReason + ')'), {retryable:true});
      try { parsed = JSON.parse(text); } catch (error) { throw Object.assign(new Error('Gemini APIの応答がJSONとして解析できませんでした'), {retryable:true}); }
      if (!isResultSubstantial(parsed)) throw Object.assign(new Error('Gemini APIの応答に主要フィールドが含まれていません'), {retryable:true});
      return parsed;
    }

    async function extractProductData(frontBase64, backBase64, apiKey, externalController) {
      var attempt;
      var lastError;
      for (attempt = 1; attempt <= GEMINI_MAX_ATTEMPTS; attempt += 1) {
        if (externalController && externalController.signal.aborted) throw Object.assign(new Error('スキャンが中止されました'), {retryable:false});
        try { return await callGeminiOnce(frontBase64, backBase64, apiKey, externalController); }
        catch (error) {
          lastError = error;
          console.warn('Gemini抽出 試行' + attempt + '/' + GEMINI_MAX_ATTEMPTS + '失敗:', error.message);
          if (attempt < GEMINI_MAX_ATTEMPTS && error.retryable !== false) {
            await abortableDelay(GEMINI_RETRY_BASE_DELAY_MS * attempt, externalController);
          } else break;
        }
      }
      throw lastError;
    }

    function pickCookMethod(cooking) {
      var microwave = cooking && cooking.microwave;
      if (microwave && microwave.wattage_500w) return {label:'Microwave Instructions', unit:'500W', time:microwave.wattage_500w};
      if (microwave && microwave.wattage_600w) return {label:'Microwave Instructions', unit:'600W', time:microwave.wattage_600w};
      if (cooking && cooking.pan_fry) return {label:'Pan-Fry Instructions', unit:'', time:cooking.pan_fry};
      if (cooking && cooking.other_notes) return {label:'Cooking Instructions', unit:'', time:cooking.other_notes};
      return {label:'Cooking Instructions', unit:'', time:'-'};
    }

    function renderResult(data) {
      var cooking = data && data.cooking_instructions;
      var method = pickCookMethod(cooking);
      var kcal = data && data.nutrition && data.nutrition.calories_kcal;
      var allergens = data && Array.isArray(data.allergens) && data.allergens.length ? data.allergens : ['検出なし'];
      var container = byId('res-allergens');
      var unitEl = byId('res-cook-unit');

      byId('res-name').textContent = data && data.product_name ? data.product_name : '(商品名不明)';
      byId('res-cook-label').textContent = method.label;
      unitEl.textContent = method.unit;
      unitEl.style.display = method.unit ? '' : 'none';
      byId('res-time').textContent = method.time;
      byId('res-jan').textContent = data && data.gtin_jan ? data.gtin_jan : '-';
      byId('res-cal').textContent = kcal === 0 || kcal ? kcal + ' kcal' : '-';
      container.textContent = '';
      allergens.forEach(function (allergen) {
        var badge = document.createElement('span');
        badge.className = 'allergen';
        badge.textContent = String(allergen);
        container.appendChild(badge);
      });
    }

    async function processAI() {
      var apiKey = getApiKey();
      var myGeneration;
      var controller;
      var result;

      if (!apiKey || !capturedFront || !capturedBack) {
        renderResult(MOCK_RESULT);
        navigateTo('result');
        return;
      }

      myGeneration = scanGeneration;
      controller = new AbortController();
      activeAbortController = controller;
      try {
        result = await extractProductData(capturedFront, capturedBack, apiKey, controller);
      } catch (error) {
        if (myGeneration !== scanGeneration || controller.signal.aborted) return;
        console.error('Gemini extraction failed', error);
        window.alert('AI解析に失敗しました。モックデータを表示します。\n' + error.message);
        result = MOCK_RESULT;
      } finally {
        if (activeAbortController === controller) activeAbortController = null;
      }
      if (myGeneration !== scanGeneration) return;
      renderResult(result);
      navigateTo('result');
    }

    function resetScan() {
      currentStep = 'FRONT';
      capturedFront = null;
      capturedBack = null;
      byId('flip-container').classList.remove('flipped');
      byId('shutter').classList.remove('back-step');
      byId('shutter').disabled = true;
      updateUI();
      setCameraStatus('', false);
    }

    function bindEvents() {
      byId('new-scan-button').addEventListener('click', function () { navigateTo('scan'); });
      byId('shutter').addEventListener('click', handleCapture);
      byId('abort-button').addEventListener('click', function () { navigateTo('home'); });
      byId('done-button').addEventListener('click', function () { navigateTo('home'); });
      byId('scan-next-button').addEventListener('click', function () { navigateTo('scan'); });
    }

    function bootstrap() {
      byId('app-version').textContent = 'Experimental Lab v' + APP_VERSION;
      bindEvents();
      renderResult(MOCK_RESULT);
      console.log('SCANHUNT EXPERIMENTAL LAB', APP_VERSION);
    }

    try { bootstrap(); }
    catch (error) { console.error('bootstrap failed', error); showFatal(error.message || String(error)); }
  }());
  </script>
</body>
</html>
