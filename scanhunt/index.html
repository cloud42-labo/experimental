<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanhunt | Experimental Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #3b82f6; --neon-orange: #f97316; --bg-dark: #020617; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; }

        /* 3D Flip System */
        .perspective { perspective: 1200px; }
        .flip-card {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flipped { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; position: absolute; inset: 0; }

        /* UI Animations */
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scan-line {
            height: 2px; background: linear-gradient(to right, transparent, var(--neon-blue), transparent);
            position: absolute; width: 100%; top: 20%; animation: scan 2s infinite; z-index: 20;
        }
        @keyframes scan { 0% { top: 20%; opacity: 0; } 50% { opacity: 1; } 100% { top: 80%; opacity: 0; } }

        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!--
      DEVELOPMENT DOCS (Hidden in UI)
      -------------------------------
      Concept: "Discard boxes, keep data."
      Target: Frozen Food / Imported Food
      Next Step: Replace 'handleCapture()' logic with actual Gemini API Multimodal call.
    -->

    <!-- 1. HOME SCREEN -->
    <div id="page-home" class="page active flex flex-col items-center justify-center h-screen p-8 text-center bg-gradient-to-b from-slate-900 to-black">
        <div class="w-20 h-20 bg-blue-600 rounded-[2rem] mb-6 flex items-center justify-center shadow-[0_0_50px_rgba(59,130,246,0.3)]">
            <span class="text-3xl font-black italic tracking-tighter">SH</span>
        </div>
        <h1 class="text-5xl font-black italic tracking-tighter mb-2">SCANHUNT</h1>
        <p id="app-version" class="text-blue-500 font-mono text-[10px] tracking-[0.3em] uppercase mb-12">Experimental Lab v0.1.0</p>

        <div class="w-full max-w-xs space-y-4">
            <button onclick="nav('scan')" class="w-full bg-white text-black font-black py-5 rounded-2xl text-xl shadow-2xl active:scale-95 transition-transform">
                NEW SCAN
            </button>
            <div class="flex gap-2">
                <div class="flex-1 glass p-4 rounded-2xl text-left">
                    <p class="text-[9px] font-bold text-slate-500 uppercase">My Items</p>
                    <p class="text-lg font-black tracking-tight italic">24</p>
                </div>
                <div class="flex-1 glass p-4 rounded-2xl text-left border-blue-500/30">
                    <p class="text-[9px] font-bold text-blue-500 uppercase">Contribution</p>
                    <p class="text-lg font-black tracking-tight italic text-blue-400">B2B OK</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. SCANNING SCREEN -->
    <div id="page-scan" class="page h-screen bg-black relative">
        <div class="absolute top-12 w-full z-50 px-8 text-center pointer-events-none">
            <div id="guide-badge" class="inline-block glass px-6 py-2 rounded-full border border-white/20 transition-all">
                <span id="guide-text" class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-400">Step 1: Front (Product Identity)</span>
            </div>
        </div>

        <div class="h-[70vh] w-full pt-24 pb-12 px-6 perspective">
            <div id="flip-container" class="flip-card">
                <!-- Front Side -->
                <div class="backface-hidden rounded-[3rem] border-2 border-blue-500/30 overflow-hidden bg-slate-900 shadow-2xl">
                    <video id="v1" autoplay playsinline class="w-full h-full object-cover grayscale-[0.2]"></video>
                    <div class="scan-line"></div>
                </div>
                <!-- Back Side -->
                <div class="backface-hidden rounded-[3rem] border-2 border-orange-500/30 overflow-hidden bg-slate-900 shadow-2xl" style="transform: rotateY(180deg);">
                    <video id="v2" autoplay playsinline class="w-full h-full object-cover opacity-60"></video>
                    <div class="absolute inset-0 bg-orange-500/10 backdrop-blur-[2px]"></div>
                </div>
            </div>
        </div>

        <!-- Shutter Button -->
        <div class="absolute bottom-12 w-full flex flex-col items-center gap-6">
            <button id="shutter" onclick="handleCapture()" class="group relative w-20 h-20 bg-white rounded-full flex items-center justify-center p-2 shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-90 transition-all">
                <div id="shutter-inner" class="w-full h-full border-4 border-black/10 rounded-full flex items-center justify-center transition-colors">
                    <div class="w-4 h-4 bg-black rounded-sm animate-pulse"></div>
                </div>
            </button>
            <button onclick="nav('home')" class="text-[10px] font-black tracking-widest text-slate-500 uppercase">Abort Mission</button>
        </div>
    </div>

    <!-- 3. RESULT / RECIPE SCREEN -->
    <div id="page-result" class="page h-screen bg-slate-950 overflow-y-auto">
        <div class="p-8 pt-16 pb-32">
            <div class="flex justify-between items-center mb-8">
                <div class="bg-blue-600 text-[10px] font-black px-3 py-1 rounded shadow-lg animate-pulse uppercase tracking-widest">
                    AI Analysis Result
                </div>
                <button onclick="nav('home')" class="text-slate-500 font-black text-xs uppercase tracking-widest">Done</button>
            </div>

            <!-- Main Data Card -->
            <div class="glass rounded-[2.5rem] p-8 mb-6 border border-white/10 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl"></div>
                <p class="text-blue-500 text-[10px] font-black uppercase mb-2 tracking-[0.2em]">Validated Product</p>
                <h2 id="res-name" class="text-4xl font-black leading-tight mb-6 italic tracking-tighter">海鮮ちゃんぽん</h2>

                <div class="space-y-4">
                    <div class="bg-orange-600 text-white p-6 rounded-[2rem] shadow-xl">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-[10px] font-black uppercase opacity-60">Microwave Instructions</p>
                            <span class="text-[10px] font-mono font-bold">500W</span>
                        </div>
                        <p id="res-time" class="text-5xl font-black tracking-tighter italic">5<span class="text-2xl">m</span> 30<span class="text-2xl">s</span></p>
                    </div>
                </div>
            </div>

            <!-- B2B & Detail Layer -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="glass p-5 rounded-[2rem]">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-2">GTIN / JAN</p>
                    <p id="res-jan" class="font-mono text-xs font-bold text-blue-400">4902105109885</p>
                </div>
                <div class="glass p-5 rounded-[2rem]">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-2">Health Log</p>
                    <p id="res-cal" class="font-mono text-xs font-bold text-white">452 kcal</p>
                </div>
            </div>

            <div class="glass p-6 rounded-[2rem]">
                <p class="text-[9px] font-black text-slate-500 uppercase mb-3">Allergens Detected</p>
                <div id="res-allergens" class="flex flex-wrap gap-2 uppercase text-[9px] font-black">
                    <!-- Dynamic Badges -->
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
            <button onclick="nav('scan')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl text-lg shadow-2xl active:scale-95 transition-all">
                SCAN NEXT ITEM
            </button>
        </div>
    </div>

    <script>
        const APP_VERSION = "0.1.0";

        // --- State Management ---
        let currentStep = 'FRONT';
        const state = {
            FRONT: { text: "Step 1: Front (Product Identity)", color: "text-blue-400", shutter: "bg-white" },
            BACK: { text: "Step 2: Back (Nutrition/JAN)", color: "text-orange-400", shutter: "bg-orange-500" }
        };

        // --- Navigation ---
        function nav(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(pageId === 'scan') initCamera();
            if(pageId === 'home') resetScan();
        }

        // --- Camera Logic ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1080 } }
                });
                document.getElementById('v1').srcObject = stream;
                document.getElementById('v2').srcObject = stream;
            } catch (e) {
                alert("Camera Access Required for Experimental Lab.");
            }
        }

        // --- Scanning Sequence ---
        function handleCapture() {
            if(navigator.vibrate) navigator.vibrate(60);

            if (currentStep === 'FRONT') {
                currentStep = 'BACK';
                document.getElementById('flip-container').classList.add('flipped');
                updateUI();
            } else {
                processAI();
            }
        }

        function updateUI() {
            const s = state[currentStep];
            document.getElementById('guide-text').innerText = s.text;
            document.getElementById('guide-text').className = `text-[10px] font-black uppercase tracking-[0.2em] ${s.color}`;
            document.getElementById('shutter').className = `group relative w-20 h-20 ${s.shutter} rounded-full flex items-center justify-center p-2 shadow-2xl active:scale-90 transition-all`;
        }

        function processAI() {
            // Simulated AI extraction from Image (TODO: replace with Gemini API multimodal call)
            const mockResult = {
                name: "極旨！海鮮ちゃんぽん",
                time: "5<span class='text-2xl'>m</span> 30<span class='text-2xl'>s</span>",
                jan: "4902105109885",
                cal: "452 kcal",
                allergens: ["Wheat", "Egg", "Milk", "Shrimp", "Soy"]
            };

            // Inject to Result Page
            document.getElementById('res-name').innerText = mockResult.name;
            document.getElementById('res-time').innerHTML = mockResult.time;
            document.getElementById('res-jan').innerText = mockResult.jan;
            document.getElementById('res-cal').innerText = mockResult.cal;

            const algContainer = document.getElementById('res-allergens');
            algContainer.innerHTML = mockResult.allergens.map(a =>
                `<span class="bg-red-900/40 text-red-400 border border-red-500/30 px-3 py-1 rounded-full">${a}</span>`
            ).join('');

            nav('result');
        }

        function resetScan() {
            currentStep = 'FRONT';
            document.getElementById('flip-container').classList.remove('flipped');
            updateUI();
        }

        document.getElementById('app-version').textContent = `Experimental Lab v${APP_VERSION}`;

        // --- Design Doc for Experimental Repo ---
        console.log("%c SCANHUNT EXPERIMENTAL LAB ", "background: #3b82f6; color: white; font-weight: bold; padding: 4px;");
        console.log("Concept: Discard paper boxes, keep digital recipes.");
        console.log("Future API: POST /api/analyze { front_img, back_img } -> Gemini-1.5-Flash");
    </script>
</body>
</html>
