<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanhunt | Experimental Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #3b82f6; --neon-orange: #f97316; --bg-dark: #020617; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; }

        /* 3D Flip System */
        .perspective { perspective: 1200px; }
        .flip-card {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flipped { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; position: absolute; inset: 0; }

        /* UI Animations */
        .page { display: none; }
        .page.active { display: revert; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scan-line {
            height: 2px; background: linear-gradient(to right, transparent, var(--neon-blue), transparent);
            position: absolute; width: 100%; top: 20%; animation: scan 2s infinite; z-index: 20;
        }
        @keyframes scan { 0% { top: 20%; opacity: 0; } 50% { opacity: 1; } 100% { top: 80%; opacity: 0; } }

        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!--
      DEVELOPMENT DOCS (Hidden in UI)
      -------------------------------
      Concept: "Discard boxes, keep data."
      Target: Frozen Food / Imported Food
      Gemini API key: prompted once, stored in localStorage only (never in source/Notion).
    -->

    <!-- 1. HOME SCREEN -->
    <div id="page-home" class="page active flex flex-col items-center justify-center h-screen p-8 text-center bg-gradient-to-b from-slate-900 to-black">
        <div class="w-20 h-20 bg-blue-600 rounded-[2rem] mb-6 flex items-center justify-center shadow-[0_0_50px_rgba(59,130,246,0.3)]">
            <span class="text-3xl font-black italic tracking-tighter">SH</span>
        </div>
        <h1 class="text-5xl font-black italic tracking-tighter mb-2">SCANHUNT</h1>
        <p id="app-version" class="text-blue-500 font-mono text-[10px] tracking-[0.3em] uppercase mb-12">Experimental Lab v0.1.0</p>

        <div class="w-full max-w-xs space-y-4">
            <button onclick="nav('scan')" class="w-full bg-white text-black font-black py-5 rounded-2xl text-xl shadow-2xl active:scale-95 transition-transform">
                NEW SCAN
            </button>
            <div class="flex gap-2">
                <div class="flex-1 glass p-4 rounded-2xl text-left">
                    <p class="text-[9px] font-bold text-slate-500 uppercase">My Items</p>
                    <p class="text-lg font-black tracking-tight italic">24</p>
                </div>
                <div class="flex-1 glass p-4 rounded-2xl text-left border-blue-500/30">
                    <p class="text-[9px] font-bold text-blue-500 uppercase">Contribution</p>
                    <p class="text-lg font-black tracking-tight italic text-blue-400">B2B OK</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. SCANNING SCREEN -->
    <div id="page-scan" class="page h-screen bg-black relative">
        <div class="absolute top-12 w-full z-50 px-8 text-center pointer-events-none">
            <div id="guide-badge" class="inline-block glass px-6 py-2 rounded-full border border-white/20 transition-all">
                <span id="guide-text" class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-400">Step 1: Front (Product Identity)</span>
            </div>
        </div>

        <div class="h-[70vh] w-full pt-24 pb-12 px-6 perspective">
            <div id="flip-container" class="flip-card">
                <!-- Front Side -->
                <div class="backface-hidden rounded-[3rem] border-2 border-blue-500/30 overflow-hidden bg-slate-900 shadow-2xl">
                    <video id="v1" autoplay playsinline class="w-full h-full object-cover grayscale-[0.2]"></video>
                    <div class="scan-line"></div>
                </div>
                <!-- Back Side -->
                <div class="backface-hidden rounded-[3rem] border-2 border-orange-500/30 overflow-hidden bg-slate-900 shadow-2xl" style="transform: rotateY(180deg);">
                    <video id="v2" autoplay playsinline class="w-full h-full object-cover opacity-60"></video>
                    <div class="absolute inset-0 bg-orange-500/10 backdrop-blur-[2px]"></div>
                </div>
            </div>
        </div>

        <!-- Shutter Button -->
        <div class="absolute bottom-12 w-full flex flex-col items-center gap-6">
            <button id="shutter" onclick="handleCapture()" class="group relative w-20 h-20 bg-white rounded-full flex items-center justify-center p-2 shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-90 transition-all">
                <div id="shutter-inner" class="w-full h-full border-4 border-black/10 rounded-full flex items-center justify-center transition-colors">
                    <div class="w-4 h-4 bg-black rounded-sm animate-pulse"></div>
                </div>
            </button>
            <button onclick="nav('home')" class="text-[10px] font-black tracking-widest text-slate-500 uppercase">Abort Mission</button>
        </div>
    </div>

    <!-- 3. RESULT / RECIPE SCREEN -->
    <div id="page-result" class="page h-screen bg-slate-950 overflow-y-auto">
        <div class="p-8 pt-16 pb-32">
            <div class="flex justify-between items-center mb-8">
                <div class="bg-blue-600 text-[10px] font-black px-3 py-1 rounded shadow-lg animate-pulse uppercase tracking-widest">
                    AI Analysis Result
                </div>
                <button onclick="nav('home')" class="text-slate-500 font-black text-xs uppercase tracking-widest">Done</button>
            </div>

            <!-- Main Data Card -->
            <div class="glass rounded-[2.5rem] p-8 mb-6 border border-white/10 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 blur-3xl"></div>
                <p class="text-blue-500 text-[10px] font-black uppercase mb-2 tracking-[0.2em]">Validated Product</p>
                <h2 id="res-name" class="text-4xl font-black leading-tight mb-6 italic tracking-tighter">海鮮ちゃんぽん</h2>

                <div class="space-y-4">
                    <div class="bg-orange-600 text-white p-6 rounded-[2rem] shadow-xl">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-[10px] font-black uppercase opacity-60">Microwave Instructions</p>
                            <span class="text-[10px] font-mono font-bold">500W</span>
                        </div>
                        <p id="res-time" class="text-3xl font-black tracking-tighter italic">5分30秒</p>
                    </div>
                </div>
            </div>

            <!-- B2B & Detail Layer -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="glass p-5 rounded-[2rem]">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-2">GTIN / JAN</p>
                    <p id="res-jan" class="font-mono text-xs font-bold text-blue-400">4902105109885</p>
                </div>
                <div class="glass p-5 rounded-[2rem]">
                    <p class="text-[9px] font-black text-slate-500 uppercase mb-2">Health Log</p>
                    <p id="res-cal" class="font-mono text-xs font-bold text-white">452 kcal</p>
                </div>
            </div>

            <div class="glass p-6 rounded-[2rem]">
                <p class="text-[9px] font-black text-slate-500 uppercase mb-3">Allergens Detected</p>
                <div id="res-allergens" class="flex flex-wrap gap-2 uppercase text-[9px] font-black">
                    <!-- Dynamic Badges -->
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
            <button onclick="nav('scan')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl text-lg shadow-2xl active:scale-95 transition-all">
                SCAN NEXT ITEM
            </button>
        </div>
    </div>

    <script>
        const APP_VERSION = "0.3.0";
        // gemini-2.5-flash returns 404 for new API keys ("no longer available to new users").
        // gemini-flash-latest tracks Google's current recommended flash-tier model.
        const GEMINI_MODEL = "gemini-flash-latest";
        const GEMINI_API_KEY_STORAGE_KEY = "scanhunt_gemini_api_key";
        const GEMINI_MAX_ATTEMPTS = 3;
        const GEMINI_RETRY_BASE_DELAY_MS = 1000;
        const GEMINI_REQUEST_TIMEOUT_MS = 25000;

        // --- State Management ---
        let currentStep = 'FRONT';
        let capturedFront = null;
        let capturedBack = null;
        // Bumped whenever the user leaves an in-flight analysis (Abort Mission / new scan).
        // processAI() checks this after awaiting Gemini so a late/aborted response can't
        // hijack the UI back to the result screen.
        let scanGeneration = 0;
        let activeAbortController = null;
        const state = {
            FRONT: { text: "Step 1: Front (Product Identity)", color: "text-blue-400", shutter: "bg-white" },
            BACK: { text: "Step 2: Back (Nutrition/JAN)", color: "text-orange-400", shutter: "bg-orange-500" }
        };

        // --- Navigation ---
        function nav(pageId) {
            const current = document.querySelector('.page.active');
            if (current && current.id === 'page-scan' && pageId !== 'scan') {
                stopCamera();
            }
            if (pageId === 'home' || pageId === 'scan') {
                cancelActiveAnalysis();
            }

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');

            if(pageId === 'scan') {
                resetScan();
                initCamera();
            }
        }

        function cancelActiveAnalysis() {
            scanGeneration++;
            if (activeAbortController) {
                activeAbortController.abort();
            }
        }

        // --- Camera Logic ---
        let currentStream = null;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1080 } }
                });
                currentStream = stream;
                document.getElementById('v1').srcObject = stream;
                document.getElementById('v2').srcObject = stream;
            } catch (e) {
                alert("Camera Access Required for Experimental Lab.");
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('v1').srcObject = null;
            document.getElementById('v2').srcObject = null;
        }

        // --- Frame Capture ---
        // Returns null (instead of an empty/garbage frame) if the video has no current
        // image yet — e.g. shutter tapped before getUserMedia resolves, before
        // loadedmetadata fires, or after camera permission was denied.
        function captureFrame(videoEl) {
            if (!videoEl.videoWidth || !videoEl.videoHeight || videoEl.readyState < videoEl.HAVE_CURRENT_DATA) {
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            try {
                canvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.error('captureFrame failed', e);
                return null;
            }
            return canvas.toDataURL('image/jpeg', 0.85).split(',')[1]; // base64, no data: prefix
        }

        // --- Scanning Sequence ---
        function handleCapture() {
            const frame = captureFrame(document.getElementById('v1'));
            if (!frame) {
                alert('カメラの映像がまだ準備できていません。少し待ってからもう一度お試しください。');
                return;
            }

            if(navigator.vibrate) navigator.vibrate(60);

            if (currentStep === 'FRONT') {
                capturedFront = frame;
                currentStep = 'BACK';
                document.getElementById('flip-container').classList.add('flipped');
                updateUI();
            } else {
                capturedBack = frame;
                processAI();
            }
        }

        function updateUI() {
            const s = state[currentStep];
            document.getElementById('guide-text').innerText = s.text;
            document.getElementById('guide-text').className = `text-[10px] font-black uppercase tracking-[0.2em] ${s.color}`;
            document.getElementById('shutter').className = `group relative w-20 h-20 ${s.shutter} rounded-full flex items-center justify-center p-2 shadow-2xl active:scale-90 transition-all`;
        }

        // --- Gemini API (multimodal extraction) ---
        // JSON Schema is defined in scanhunt/README.md — keep both in sync.
        const GEMINI_RESPONSE_SCHEMA = {
            type: "OBJECT",
            properties: {
                gtin_jan: { type: "STRING" },
                product_name: { type: "STRING" },
                brand: { type: "STRING" },
                category: { type: "STRING" },
                temperature_zone: { type: "STRING" },
                cooking_instructions: {
                    type: "OBJECT",
                    properties: {
                        microwave: {
                            type: "OBJECT",
                            properties: {
                                wattage_500w: { type: "STRING" },
                                wattage_600w: { type: "STRING" }
                            }
                        },
                        pan_fry: { type: "STRING" },
                        other_notes: { type: "STRING" }
                    }
                },
                nutrition: {
                    type: "OBJECT",
                    properties: {
                        calories_kcal: { type: "NUMBER" },
                        protein_g: { type: "NUMBER" },
                        fat_g: { type: "NUMBER" },
                        carbs_g: { type: "NUMBER" }
                    }
                },
                allergens: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["product_name"]
        };

        function getApiKey() {
            let key = localStorage.getItem(GEMINI_API_KEY_STORAGE_KEY);
            if (!key) {
                key = window.prompt("Gemini APIキーを入力してください（このブラウザのlocalStorageにのみ保存されます。未入力ならモックデータで進みます）");
                if (key) localStorage.setItem(GEMINI_API_KEY_STORAGE_KEY, key);
            }
            return key;
        }

        // 主要フィールドが1つも埋まっていない結果は「壊れた抽出」とみなしリトライ対象にする。
        // STORY-05の実写真検証で、finishReason=STOPかつJSONとしては妥当でも
        // cooking_instructions/nutrition/allergensが軒並み空のケースが確認されたため。
        function isResultSubstantial(data) {
            const cooking = data.cooking_instructions;
            const hasCooking = Boolean(
                cooking && (cooking.microwave?.wattage_500w || cooking.microwave?.wattage_600w || cooking.pan_fry)
            );
            const hasNutrition = Boolean(data.nutrition && Object.keys(data.nutrition).length > 0);
            const hasAllergens = Array.isArray(data.allergens) && data.allergens.length > 0;
            return hasCooking || hasNutrition || hasAllergens;
        }

        async function callGeminiOnce(frontBase64, backBase64, apiKey, externalController) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
            const body = {
                contents: [{
                    parts: [
                        { text: "これは食品パッケージの表面と裏面の写真です。1枚目が表面、2枚目が裏面です。指定されたJSON Schemaに従って、商品名・JANコード・電子レンジ調理手順・栄養成分・アレルギー物質を抽出してください。読み取れない項目は省略してください。" },
                        { inline_data: { mime_type: "image/jpeg", data: frontBase64 } },
                        { inline_data: { mime_type: "image/jpeg", data: backBase64 } }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: GEMINI_RESPONSE_SCHEMA
                }
            };

            // Combine the per-request timeout with the caller's abort (Abort Mission / new scan)
            // by relaying the external signal onto a local controller.
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), GEMINI_REQUEST_TIMEOUT_MS);
            const onExternalAbort = () => controller.abort();
            if (externalController) externalController.signal.addEventListener('abort', onExternalAbort);

            let res;
            try {
                res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: controller.signal
                });
            } catch (e) {
                if (externalController?.signal.aborted) {
                    throw Object.assign(new Error('スキャンが中止されました'), { retryable: false });
                }
                throw Object.assign(new Error('Gemini APIへの通信に失敗しました（タイムアウトまたはネットワークエラー）'), { retryable: true });
            } finally {
                clearTimeout(timeoutId);
                if (externalController) externalController.signal.removeEventListener('abort', onExternalAbort);
            }

            if (!res.ok) {
                if (res.status === 400 || res.status === 401 || res.status === 403) {
                    localStorage.removeItem(GEMINI_API_KEY_STORAGE_KEY);
                }
                const errText = await res.text();
                const err = new Error(`Gemini API error ${res.status}: ${errText}`);
                err.retryable = (res.status === 429 || res.status >= 500);
                throw err;
            }

            const data = await res.json();
            const candidate = data.candidates?.[0];
            const text = candidate?.content?.parts?.[0]?.text;
            if (!text) {
                throw Object.assign(new Error('Gemini APIから抽出結果が得られませんでした'), { retryable: true });
            }
            if (candidate.finishReason && candidate.finishReason !== 'STOP') {
                throw Object.assign(new Error(`Gemini APIの応答が不完全です (finishReason: ${candidate.finishReason})`), { retryable: true });
            }

            let parsed;
            try {
                parsed = JSON.parse(text);
            } catch (e) {
                throw Object.assign(new Error('Gemini APIの応答がJSONとして解析できませんでした'), { retryable: true });
            }

            if (!isResultSubstantial(parsed)) {
                throw Object.assign(new Error('Gemini APIの応答に主要フィールドが含まれていません'), { retryable: true });
            }

            return parsed;
        }

        async function extractProductData(frontBase64, backBase64, apiKey, externalController) {
            let lastError;
            for (let attempt = 1; attempt <= GEMINI_MAX_ATTEMPTS; attempt++) {
                if (externalController?.signal.aborted) {
                    throw Object.assign(new Error('スキャンが中止されました'), { retryable: false });
                }
                try {
                    return await callGeminiOnce(frontBase64, backBase64, apiKey, externalController);
                } catch (e) {
                    lastError = e;
                    console.warn(`Gemini抽出 試行${attempt}/${GEMINI_MAX_ATTEMPTS}失敗:`, e.message);
                    if (attempt < GEMINI_MAX_ATTEMPTS && e.retryable !== false) {
                        await new Promise(r => setTimeout(r, GEMINI_RETRY_BASE_DELAY_MS * attempt));
                        continue;
                    }
                    break;
                }
            }
            throw lastError;
        }

        const MOCK_RESULT = {
            product_name: "極旨！海鮮ちゃんぽん",
            gtin_jan: "4902105109885",
            cooking_instructions: { microwave: { wattage_500w: "5分30秒" } },
            nutrition: { calories_kcal: 452 },
            allergens: ["小麦", "卵", "乳", "えび", "大豆"]
        };

        function renderResult(data) {
            document.getElementById('res-name').innerText = data.product_name || '(商品名不明)';

            const micro = data.cooking_instructions?.microwave;
            document.getElementById('res-time').innerText =
                micro?.wattage_500w || micro?.wattage_600w || data.cooking_instructions?.pan_fry || '-';

            document.getElementById('res-jan').innerText = data.gtin_jan || '-';

            const kcal = data.nutrition?.calories_kcal;
            document.getElementById('res-cal').innerText = (kcal || kcal === 0) ? `${kcal} kcal` : '-';

            const algContainer = document.getElementById('res-allergens');
            algContainer.innerHTML = '';
            const allergens = (data.allergens && data.allergens.length) ? data.allergens : ['検出なし'];
            // Gemini output is untrusted (OCR misreads, hallucination, or a maliciously
            // crafted package label could contain markup). Build badges via the DOM API
            // and set text with textContent so it can never be parsed as HTML/script.
            allergens.forEach(a => {
                const badge = document.createElement('span');
                badge.className = 'bg-red-900/40 text-red-400 border border-red-500/30 px-3 py-1 rounded-full';
                badge.textContent = a;
                algContainer.appendChild(badge);
            });
        }

        async function processAI() {
            const apiKey = getApiKey();

            if (!apiKey || !capturedFront || !capturedBack) {
                renderResult(MOCK_RESULT);
                nav('result');
                return;
            }

            const myGeneration = scanGeneration;
            const controller = new AbortController();
            activeAbortController = controller;

            let result = null;
            let failed = false;
            let failureMessage = '';

            try {
                result = await extractProductData(capturedFront, capturedBack, apiKey, controller);
            } catch (e) {
                failed = true;
                failureMessage = e.message;
                console.error('Gemini extraction failed', e);
            } finally {
                if (activeAbortController === controller) activeAbortController = null;
            }

            // Abort Mission や次のスキャン開始で世代が進んでいたら、
            // 遅れて届いた結果で画面を上書きしない。
            if (myGeneration !== scanGeneration) return;

            if (failed) {
                alert('AI解析に失敗しました。モックデータを表示します。\n' + failureMessage);
                renderResult(MOCK_RESULT);
            } else {
                renderResult(result);
            }

            nav('result');
        }

        function resetScan() {
            currentStep = 'FRONT';
            capturedFront = null;
            capturedBack = null;
            document.getElementById('flip-container').classList.remove('flipped');
            updateUI();
        }

        document.getElementById('app-version').textContent = `Experimental Lab v${APP_VERSION}`;

        // --- Design Doc for Experimental Repo ---
        console.log("%c SCANHUNT EXPERIMENTAL LAB ", "background: #3b82f6; color: white; font-weight: bold; padding: 4px;");
        console.log("Concept: Discard paper boxes, keep digital recipes.");
        console.log(`AI extraction: client-side call to Gemini API (${GEMINI_MODEL}), key prompted once and stored in localStorage only.`);
    </script>
</body>
</html>
