name: AI PR Review Loop

# Claude が作った PR (claude/* ブランチ) を OpenAI Codex が自動レビューし、
# 指摘があれば Claude が自動修正して再レビュー、CI 成功かつ指摘なしで自動マージする。
#
# 設計上の注意（重要）: GITHUB_TOKEN で行った push・レビュー投稿は、新しい workflow run を
# 起動しない（GitHubの仕様。再帰的な実行を防ぐための制限）。そのため「レビュー→修正→
# 再レビュー」を pull_request_review / synchronize イベントの連鎖で進める設計は実際には
# 動かない。ここでは代わりに、実処理を reusable workflow (ai-review-round.yml) に切り出し、
# **この1回のworkflow run（このジョブDAG）の中で最大3回 (round1〜round3) 直接呼び出す**
# ことで、イベント連鎖に依存せずレビュー・修正ループを完結させている。
#
# 詳細: README.md の「AIレビュー・修正ループ」節、レビュー規約は AGENTS.md。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   ANTHROPIC_API_KEY または CLAUDE_CODE_OAUTH_TOKEN   どちらか一方。Claude Code用。
#   OPENAI_API_KEY                                      必須。Codexレビュー用。
#
# 必要なリポジトリ設定:
#   Settings > Actions > General > Workflow permissions を "Read and write permissions" にする
#   （commit の push・PR のマージ・ラベル付けを行うため）。
#
# 既知の限界: このワークフローがGITHUB_TOKENで行うpushは、他のworkflow（将来PR時に追加され
# うるCIなど）を起動しない。修正後のコミットに対してもCIを回したい場合、CIをこの
# ワークフロー内のジョブとして直接組み込むか、pushをPAT/GitHub Appトークンに切り替える
# 必要がある。現状このリポジトリにPR時点のCIは無いため、影響は無い。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "評価する PR 番号（needs-human 解除後の手動再開などに使う）"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: ai-pr-review-loop-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      number: ${{ steps.guard.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 必要なラベルを用意する
        run: |
          set -euo pipefail
          gh label create "needs-human" -c d73a4a -d "AIループが収束しなかった。人間の判断が必要" --force

      - name: PRが対象か判定する
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NUM="$DISPATCH_PR"
          else
            NUM=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          fi
          if [ -z "$NUM" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$NUM" --json state,isDraft,headRefName,labels > pr.json
          STATE=$(jq -r '.state' pr.json)
          DRAFT=$(jq -r '.isDraft' pr.json)
          HEAD_REF=$(jq -r '.headRefName' pr.json)
          HAS_NEEDS_HUMAN=$(jq -r '[.labels[].name] | index("needs-human") != null' pr.json)

          if [ "$STATE" != "OPEN" ] || [ "$DRAFT" = "true" ] || [ "$HAS_NEEDS_HUMAN" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_REF" in
            claude/*) ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

  round1:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ needs.guard.outputs.number }}
    secrets: inherit

  round2:
    needs: [guard, round1]
    if: needs.guard.outputs.proceed == 'true' && needs.round1.outputs.verdict == 'REQUEST_CHANGES'
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ needs.guard.outputs.number }}
    secrets: inherit

  round3:
    needs: [guard, round2]
    if: needs.guard.outputs.proceed == 'true' && needs.round2.outputs.verdict == 'REQUEST_CHANGES'
    uses: ./.github/workflows/ai-review-round.yml
    with:
      pr_number: ${{ needs.guard.outputs.number }}
    secrets: inherit

  resolve:
    needs: [guard, round1, round2, round3]
    if: always() && needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.guard.outputs.number }}
      MARKER: "<!-- codex-review-loop -->"
      V1: ${{ needs.round1.outputs.verdict }}
      V2: ${{ needs.round2.outputs.verdict }}
      V3: ${{ needs.round3.outputs.verdict }}
    steps:
      - name: 最終判定してマージ or エスカレーションする
        run: |
          set -euo pipefail
          FINAL="$V1"
          [ -n "$V2" ] && FINAL="$V2"
          [ -n "$V3" ] && FINAL="$V3"

          if [ -z "$FINAL" ]; then
            echo "最終判定を確定できなかった（ラウンドが実行されなかったか失敗した）。終了する。"
            exit 0
          fi

          if [ "$FINAL" = "REQUEST_CHANGES" ]; then
            gh pr edit "$PR_NUMBER" --add-label "needs-human"
            {
              echo "$MARKER"
              echo
              echo "AIレビュー・修正ループ: 最大3ラウンドで収束しませんでした。"
              echo "人間の判断をお願いします。"
              echo
              echo "対応後、\`needs-human\` ラベルを外し、Actions画面から"
              echo "「AI PR Review Loop」を workflow_dispatch（PR番号指定）で手動再実行すると"
              echo "ループを再開できます。"
            } > /tmp/escalate-body.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/escalate-body.md
            exit 0
          fi

          # FINAL = APPROVE
          CHECKS=$(gh pr checks "$PR_NUMBER" --json bucket 2>/dev/null || echo '[]')
          FAIL=$(echo "$CHECKS" | jq '[.[] | select(.bucket=="fail" or .bucket=="cancel")] | length')
          PENDING=$(echo "$CHECKS" | jq '[.[] | select(.bucket=="pending")] | length')

          if [ "$FAIL" -gt 0 ]; then
            {
              echo "$MARKER"
              echo
              echo "AIレビュー・修正ループ: Codexは承認しましたが、CIが失敗しているため"
              echo "自動マージしません。"
            } > /tmp/ci-fail-body.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/ci-fail-body.md
            exit 0
          fi
          if [ "$PENDING" -gt 0 ]; then
            {
              echo "$MARKER"
              echo
              echo "AIレビュー・修正ループ: Codexは承認しましたが、CIがまだ実行中のため"
              echo "自動マージしません。CI完了後、Actions画面から「AI PR Review Loop」を"
              echo "workflow_dispatch（PR番号指定）で再実行してください。"
            } > /tmp/ci-pending-body.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/ci-pending-body.md
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --squash --delete-branch
