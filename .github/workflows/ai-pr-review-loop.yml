name: AI PR Review Loop

# Claude が作った PR (claude/* ブランチ) を OpenAI Codex が自動レビューし、
# 指摘があれば Claude が自動修正して再レビュー、CI 成功かつ指摘なしで自動マージする。
# 最大3ラウンド (MAX_ROUNDS) で収束しなければ `needs-human` ラベルを付けて停止し、
# 人間の判断を待つ。
#
# 詳細: README.md の「AIレビュー・修正ループ」節。レビュー規約は AGENTS.md（Codex Action は
# リポジトリ直下の AGENTS.md を自動的に読む）。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   ANTHROPIC_API_KEY または CLAUDE_CODE_OAUTH_TOKEN   どちらか一方。Claude Code用。
#   OPENAI_API_KEY                                      必須。Codexレビュー用。
#
# 必要なリポジトリ設定:
#   Settings > Actions > General > Workflow permissions を "Read and write permissions" にする
#   （commit の push・PR のマージ・ラベル付けを行うため）。
#
# 設計方針: ジョブ間・ステップ間で状態を持ち越さず、毎回 GitHub 側の実データ（ラベル・
# レビュー・チェック結果）を読み直して次のアクションを決める。イベントの欠落・順序の
# 入れ替わりに強くするため（1ステップ内でも `secrets` を `if:` に直書きしない、複数行文字列は
# ファイルに書き出してから渡す、という過去の失敗（notes/github-actions-invalid-workflow.md 相当）
# を踏まえている）。
#
# 承認直後にマージされないことがあるのは仕様: このワークフロー自身の実行中チェックが
# 「実行中」である間は CI 成功と判定されない。ワークフローが完了すると check_suite の
# completed イベントが再度発火し、次の実行でマージされる。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "再評価する PR 番号（needs-human 解除後の手動再開などに使う）"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: >-
    ai-pr-review-loop-${{ github.event.pull_request.number ||
    github.event.inputs.pr_number ||
    (github.event.check_suite.pull_requests[0].number || github.run_id) }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  MARKER: "<!-- codex-review-loop -->"
  MAX_ROUNDS: 3

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      number: ${{ steps.decide.outputs.number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
      round: ${{ steps.decide.outputs.round }}
      do_review: ${{ steps.decide.outputs.do_review }}
      do_fix: ${{ steps.decide.outputs.do_fix }}
      do_escalate: ${{ steps.decide.outputs.do_escalate }}
      do_merge: ${{ steps.decide.outputs.do_merge }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: PRの状態を読み、次のアクションを決める
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              NUM=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
              ;;
            check_suite)
              NUM=$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
              ;;
            workflow_dispatch)
              NUM="$DISPATCH_PR"
              ;;
            *)
              NUM=""
              ;;
          esac

          if [ -z "$NUM" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=対象PRを特定できないイベント" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$NUM" --json state,isDraft,headRefName,baseRefName,headRefOid,labels \
            > pr.json

          STATE=$(jq -r '.state' pr.json)
          DRAFT=$(jq -r '.isDraft' pr.json)
          HEAD_REF=$(jq -r '.headRefName' pr.json)
          BASE_REF=$(jq -r '.baseRefName' pr.json)
          HEAD_SHA=$(jq -r '.headRefOid' pr.json)
          HAS_NEEDS_HUMAN=$(jq -r '[.labels[].name] | index("needs-human") != null' pr.json)

          if [ "$STATE" != "OPEN" ] || [ "$DRAFT" = "true" ] || [ "$HAS_NEEDS_HUMAN" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=対象外 state=$STATE draft=$DRAFT needs-human=$HAS_NEEDS_HUMAN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_REF" in
            claude/*) ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "reason=claude/*ブランチではない ($HEAD_REF)" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          ROUND=0
          for i in 1 2 3; do
            IS_SET=$(jq -r --arg l "ai-round-$i" '[.labels[].name] | index($l) != null' pr.json)
            if [ "$IS_SET" = "true" ]; then ROUND=$i; fi
          done

          # このSHAに対する、このループが投稿した最新のレビュー(承認/要修正)を探す。
          # マーカー本文で人間の通常レビューと区別し、commit_idでSHAの一致を取ることで
          # 古いコミットに対する承認/要修正を使い回さない。
          REVIEWS=$(gh api "repos/${GH_REPO}/pulls/${NUM}/reviews" --paginate | jq -s 'add')
          LATEST=$(echo "$REVIEWS" | jq --arg sha "$HEAD_SHA" --arg marker "$MARKER" '
            [.[] | select(.commit_id == $sha and (.body // "" | startswith($marker)))]
            | sort_by(.submitted_at) | last
          ')
          VERDICT=$(echo "$LATEST" | jq -r '.state // empty')

          CI=none
          if [ "$VERDICT" = "APPROVED" ]; then
            CHECKS=$(gh pr checks "$NUM" --json bucket 2>/dev/null || echo '[]')
            FAIL=$(echo "$CHECKS" | jq '[.[] | select(.bucket=="fail" or .bucket=="cancel")] | length')
            PENDING=$(echo "$CHECKS" | jq '[.[] | select(.bucket=="pending")] | length')
            if [ "$FAIL" -gt 0 ]; then CI=failure
            elif [ "$PENDING" -gt 0 ]; then CI=pending
            else CI=success
            fi
          fi

          DO_REVIEW=false
          DO_FIX=false
          DO_ESCALATE=false
          DO_MERGE=false

          if [ -z "$VERDICT" ]; then
            DO_REVIEW=true
          elif [ "$VERDICT" = "CHANGES_REQUESTED" ] || [ "$CI" = "failure" ]; then
            if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then DO_ESCALATE=true; else DO_FIX=true; fi
          elif [ "$VERDICT" = "APPROVED" ] && [ "$CI" = "success" ]; then
            DO_MERGE=true
          fi
          # VERDICT=APPROVED かつ CI=pending/none の場合は何もせず次のイベントを待つ。

          {
            echo "proceed=true"
            echo "number=$NUM"
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
            echo "base_ref=$BASE_REF"
            echo "round=$ROUND"
            echo "do_review=$DO_REVIEW"
            echo "do_fix=$DO_FIX"
            echo "do_escalate=$DO_ESCALATE"
            echo "do_merge=$DO_MERGE"
            echo "reason=verdict=$VERDICT ci=$CI round=$ROUND"
          } >> "$GITHUB_OUTPUT"

      - name: 判定結果
        run: echo "${{ steps.decide.outputs.reason }}"

  act:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ needs.decide.outputs.number }}
      HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
      HEAD_REF: ${{ needs.decide.outputs.head_ref }}
      BASE_REF: ${{ needs.decide.outputs.base_ref }}
      ROUND: ${{ needs.decide.outputs.round }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: 必要なラベルを用意する
        run: |
          set -euo pipefail
          gh label create "ai-round-1" -c c5def5 -d "AIレビュー・修正ループ 1周目" --force
          gh label create "ai-round-2" -c 5319e7 -d "AIレビュー・修正ループ 2周目" --force
          gh label create "ai-round-3" -c b60205 -d "AIレビュー・修正ループ 3周目（最終）" --force
          gh label create "needs-human" -c d73a4a -d "AIループが収束しなかった。人間の判断が必要" --force

      # --- Codexレビュー（既存の未消化レビューが無いとき） ---
      - name: レビュー依頼文を作る
        if: needs.decide.outputs.do_review == 'true'
        run: |
          set -euo pipefail
          {
            echo "このリポジトリの pull request #${PR_NUMBER} をレビューしてください。"
            echo
            echo "- 差分は git diff origin/${BASE_REF}...HEAD で確認してください。"
            echo "  作業ディレクトリは既にこのPRのブランチをチェックアウト済みです。"
            echo "- レビュー観点は AGENTS.md に書かれた規約に従ってください。"
            echo "- コードの修正は行わず、レビューのみ行ってください。"
            echo "- 出力の最後に、次のいずれか1行だけを厳密にこの形式で書いてください。"
            echo "  他の文言と混ぜないでください。"
            echo "    CODEX_VERDICT: APPROVE"
            echo "    CODEX_VERDICT: REQUEST_CHANGES"
            echo "- REQUEST_CHANGES の場合は、その直前に具体的な指摘事項を箇条書きで"
            echo "  書いてください。"
          } > /tmp/codex-prompt.md

      - name: Codexレビューを実行する
        if: needs.decide.outputs.do_review == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/codex-prompt.md
          output-file: /tmp/codex-output.md

      - name: Codexレビューを投稿する
        if: needs.decide.outputs.do_review == 'true'
        run: |
          set -euo pipefail
          OUT=/tmp/codex-output.md
          if [ ! -s "$OUT" ]; then
            echo "CODEX_VERDICT: REQUEST_CHANGES" > "$OUT"
            echo "(Codexの出力が空だったため、安全側に倒してREQUEST_CHANGES扱いにしています)" >> "$OUT"
          fi
          VERDICT=$(grep -E '^CODEX_VERDICT: (APPROVE|REQUEST_CHANGES)$' "$OUT" | tail -1 \
            | sed -E 's/^CODEX_VERDICT: //' || true)
          if [ -z "$VERDICT" ]; then
            VERDICT="REQUEST_CHANGES"
            echo "(判定行を検出できなかったため、安全側に倒してREQUEST_CHANGES扱いにしています)" >> "$OUT"
          fi
          {
            echo "$MARKER"
            echo
            cat "$OUT"
          } > /tmp/codex-review-body.md
          if [ "$VERDICT" = "APPROVE" ]; then
            gh pr review "$PR_NUMBER" --approve --body-file /tmp/codex-review-body.md
          else
            gh pr review "$PR_NUMBER" --request-changes --body-file /tmp/codex-review-body.md
          fi

      # --- Claudeによる自動修正（指摘 or CI失敗があり、ラウンド上限未満） ---
      - name: 修正指示文を作る
        if: needs.decide.outputs.do_fix == 'true'
        run: |
          set -euo pipefail
          {
            echo "このリポジトリの pull request #${PR_NUMBER} (ブランチ ${HEAD_REF}) について、"
            echo "OpenAI Codexのレビュー指摘、および失敗しているCIチェックがあればそのログを"
            echo "確認し、問題を修正してください。"
            echo
            echo "- 最新のレビューコメントは gh api repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews"
            echo "  や gh pr view ${PR_NUMBER} --comments で確認できます。"
            echo "- 失敗しているCIは gh pr checks ${PR_NUMBER} で確認できます。"
            echo "- このリポジトリの規約は CLAUDE.md と AGENTS.md に従ってください。"
            echo "  他のディレクトリ（他の試作アプリ）には手を入れないでください。"
            echo "- 修正したら、このブランチ (${HEAD_REF}) に対してcommitし、pushしてください。"
            echo "  直すことが無いと判断した場合は、その理由をPRにコメントしてください。"
          } > /tmp/claude-fix-prompt.md

      - name: Claudeで自動修正する
        if: needs.decide.outputs.do_fix == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/tmp/claude-fix-prompt.md の指示に従ってください。"

      - name: 修正結果を確認し、ラウンドを進める
        if: needs.decide.outputs.do_fix == 'true'
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          NEW_SHA=$(git rev-parse "origin/${HEAD_REF}")
          NEXT_ROUND=$((ROUND + 1))
          if [ "$NEW_SHA" = "$HEAD_SHA" ]; then
            gh pr edit "$PR_NUMBER" --add-label "needs-human"
            {
              echo "$MARKER"
              echo
              echo "AIレビュー・修正ループ: Claudeによる自動修正がコミットを作成しませんでした"
              echo "（ラウンド $NEXT_ROUND 目）。人間の確認をお願いします。"
            } > /tmp/escalate-body.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/escalate-body.md
            exit 0
          fi
          if [ "$ROUND" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" --remove-label "ai-round-${ROUND}" || true
          fi
          gh pr edit "$PR_NUMBER" --add-label "ai-round-${NEXT_ROUND}"

      # --- 3ラウンドで収束しなかった場合のエスカレーション ---
      - name: 収束しなかったので人間に引き渡す
        if: needs.decide.outputs.do_escalate == 'true'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --add-label "needs-human"
          {
            echo "$MARKER"
            echo
            echo "AIレビュー・修正ループ: 最大 ${MAX_ROUNDS} ラウンドで収束しませんでした。"
            echo "人間の判断をお願いします。"
            echo
            echo "対応後、\`needs-human\` ラベルを外し、Actions画面から"
            echo "「AI PR Review Loop」を workflow_dispatch（PR番号指定）で手動再実行すると"
            echo "ループを再開できます。"
          } > /tmp/escalate-body.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/escalate-body.md

      # --- 承認済み・CI成功でマージ ---
      - name: 自動マージする
        if: needs.decide.outputs.do_merge == 'true'
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          for i in 1 2 3; do
            gh pr edit "$PR_NUMBER" --remove-label "ai-round-$i" 2>/dev/null || true
          done
