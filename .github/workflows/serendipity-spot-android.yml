name: serendipity-spot-android debug build

# PCが手元に無くても、スマホから直接ダウンロードして入れられるAPKを用意するための
# ワークフロー。main に入った変更を毎回ビルドし、`dev` タグのプレリリースに
# app-debug.apk を上書きで貼り直す。ダウンロードURLは常に同じ。
#
# 必要なシークレット（Settings > Secrets and variables > Actions）:
#   SERENDIPITY_DEBUG_KEYSTORE_BASE64  必須。デバッグ署名鍵をbase64にしたもの。
#                                      ここで署名した鍵のSHA-1を、Google Cloud Console の
#                                      Android型OAuthクライアントに登録しておくこと。
#                                      登録が無いとサインインだけが失敗する。
#   SERENDIPITY_GOOGLE_SERVER_CLIENT_ID 必須。「ウェブ アプリケーション」型のクライアントID。
#   SERENDIPITY_MAPS_API_KEY            任意。未設定でもビルドは通るが地図が灰色になる。

on:
  push:
    branches: [main]
    paths:
      - 'serendipity-spot-android/**'
      - '.github/workflows/serendipity-spot-android.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: serendipity-spot-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Restore debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SERENDIPITY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SERENDIPITY_DEBUG_KEYSTORE_BASE64 が未設定。" >&2
            echo "この状態でビルドするとランナーが毎回新しい鍵を作るため、SHA-1が変わり" >&2
            echo "Googleサインインが必ず失敗するAPKになる。シークレットを設定すること。" >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Write local.properties
        env:
          MAPS_API_KEY: ${{ secrets.SERENDIPITY_MAPS_API_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.SERENDIPITY_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          {
            echo "MAPS_API_KEY=${MAPS_API_KEY}"
            echo "GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}"
          } > local.properties
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::warning::SERENDIPITY_GOOGLE_SERVER_CLIENT_ID が未設定。サインインは失敗する。"
          fi
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::SERENDIPITY_MAPS_API_KEY が未設定。地図が灰色で表示される。"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show signing fingerprint
        # 実機で「サインインだけ失敗する」ときに、Cloud Console に登録した SHA-1 と
        # 突き合わせられるようログに残す。鍵そのものは出さない。
        run: |
          ./gradlew --no-daemon signingReport | grep -A2 'Variant: debug' || true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: serendipity-spot-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release view dev > /dev/null 2>&1 || \
            gh release create dev \
              --prerelease \
              --title "dev (latest debug build)" \
              --notes "main の最新デバッグビルド。push のたびに app-debug.apk が差し替わる。"
          gh release upload dev "$APK" --clobber
          echo "### APK を更新した" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/dev/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
