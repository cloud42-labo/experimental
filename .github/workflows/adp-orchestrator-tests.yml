name: ADP Orchestrator Tests

on:
  pull_request:
    paths:
      - "adp-orchestrator/**"
      - ".github/workflows/adp-orchestrator-tests.yml"
  push:
    branches:
      - main
      - "chatgpt/adp-*"
    paths:
      - "adp-orchestrator/**"
      - ".github/workflows/adp-orchestrator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adp-orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: adp-orchestrator/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run full test suite
        run: pytest -q
