name: One-time HPM v1 cockpit recover

on:
  push:
    branches:
      - chatgpt/hpm-v1-cockpit

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover payload and improve labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip,hashlib
          wf=Path('.github/workflows/one-time-hpm-v1-cockpit.yml').read_text()
          m=re.search(r"PAYLOAD: '([^']+)'",wf)
          assert m, 'payload not found'
          data=gzip.decompress(base64.b64decode(m.group(1)))
          assert hashlib.sha256(data).hexdigest()=='f9b2a0974543c717b2ffc97b51711c323bd5913dd95326b5a452f7ba49094ea7'
          s=data.decode()
          s=s.replace("actionSlider(id,'motivate','モチベ',a.motivate)","actionSlider(id,'motivate','モチベーション',a.motivate)")
          s=s.replace('5年タイムライン — 施策を打つ年と効く年を分ける','5年タイムライン — 施策を打つ年と効く年を分ける（既存社員の人件費は毎年5%上昇）')
          p=Path('human-capital-portfolio-management/v1-prototype.html')
          p.write_text(s)
          for token in ['予定された決算','人財ポートフォリオ','Year4開花','毎年5%上昇','採用','育成','配置転換','モチベーション','投資 → 人財変化 → KPI → 決算']:
            assert token in s, token
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/hpm-v1.js').write_text(s[a:b])
          print('prototype invariants: OK')
          PY
          node --check /tmp/hpm-v1.js
      - name: Commit prototype and clean temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- human-capital-portfolio-management/v1-prototype.html
          git rm -- .github/workflows/one-time-hpm-v1-cockpit.yml .github/workflows/one-time-hpm-v1-recover.yml
          git commit -m 'feat(hpm): rebuild v1 as one-screen strategic workforce cockpit'
          git push origin HEAD:${GITHUB_REF_NAME}
