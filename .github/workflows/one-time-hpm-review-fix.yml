      - name: Verify syntax and review invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('human-capital-portfolio-management/index.html')
          s=p.read_text(encoding='utf-8')
          assert 'let rng = mulberry32(RNG_SEED);' in s
          assert 'rng = mulberry32(RNG_SEED); // 新しいゲームは同じseedから開始' in s
