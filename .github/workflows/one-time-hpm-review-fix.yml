          assert 'arrive:state.year+CHANNELS.develop.lead' in s
          assert 'referralAnnualCap-referralAttemptsThisYear' in s
          assert 'referralAttemptsThisYear+=n' in s
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/hpm.js').write_text(s[a:b],encoding='utf-8')
          print('static review invariants: OK')
