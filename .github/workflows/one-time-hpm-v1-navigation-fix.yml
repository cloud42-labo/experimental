name: One-time HPM v1 navigation fix

on:
  push:
    branches:
      - chatgpt/hpm-v1-cockpit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix committed-state navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('human-capital-portfolio-management/v1-prototype.html')
          s=p.read_text()
          old='''    <div class="controls">\n      <button class="secondary" data-go="invest">配分を見直す</button>\n      <button class="primary" id="nextYearBtn">1年進める →</button>\n    </div>'''
          new='''    <div class="controls">\n      <span class="small" style="margin-right:auto">配分は経営開始時に確定済み。過去実績を書き換えないため開始後は変更できません。</span>\n      <button class="primary" id="nextYearBtn">1年進める →</button>\n    </div>'''
          assert old in s
          s=s.replace(old,new)
          old="""document.addEventListener('click',e=>{\n  const go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='manage')state.committed=true;switchPhase(go.dataset.go)}\n  const st=e.target.closest('.step');if(st)switchPhase(st.dataset.phase);\n});"""
          new="""document.addEventListener('click',e=>{\n  const go=e.target.closest('[data-go]');\n  if(go){\n    const target=go.dataset.go;\n    if(state.committed && (target==='plan'||target==='invest'))return;\n    if(target==='manage' && !state.committed){\n      if(actionCost()>budgetAvailable())return;\n      state.committed=true;\n    }\n    if(target==='result' && (!state.committed||state.year<5))return;\n    switchPhase(target);\n  }\n  const st=e.target.closest('.step');\n  if(st){\n    const target=st.dataset.phase;\n    if(state.committed && (target==='plan'||target==='invest'))return;\n    if(target==='manage' && !state.committed)return;\n    if(target==='result' && (!state.committed||state.year<5))return;\n    switchPhase(target);\n  }\n});"""
          assert old in s
          s=s.replace(old,new)
          assert 'data-go="invest">配分を見直す' not in s
          assert "if(actionCost()>budgetAvailable())return;" in s
          assert "state.committed && (target==='plan'||target==='invest')" in s
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/hpm-v1.js').write_text(s[a:b])
          p.write_text(s)
          PY
          node --check /tmp/hpm-v1.js
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-capital-portfolio-management/v1-prototype.html
          git rm .github/workflows/one-time-hpm-v1-navigation-fix.yml
          git commit -m 'fix(hpm): lock allocation after management starts'
          git push origin HEAD:${GITHUB_REF_NAME}
