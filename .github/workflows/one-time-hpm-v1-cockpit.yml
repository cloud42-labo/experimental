name: One-time HPM v1 cockpit publish

on:
  push:
    branches:
      - chatgpt/hpm-v1-cockpit

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write prototype
        shell: bash
        env:
          PAYLOAD: '' 
        run: |
          python - <<'PY'
          import os,base64,gzip,hashlib
          p='human-capital-portfolio-management/v1-prototype.html'
          data=gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(data).hexdigest()=='f9b2a0974543c717b2ffc97b51711c323bd5913dd95326b5a452f7ba49094ea7'
          open(p,'wb').write(data)
          PY
      - name: Verify prototype
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('human-capital-portfolio-management/v1-prototype.html').read_text()
          for token in ['予定された決算','人財ポートフォリオ','3年後','5%','採用','育成','配置転換','モチベーション','投資 → 人財変化 → KPI → 決算']:
            assert token in s, token
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/hpm-v1.js').write_text(s[a:b])
          print('prototype invariants: OK')
          PY
          node --check /tmp/hpm-v1.js
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- human-capital-portfolio-management/v1-prototype.html
          git rm -- .github/workflows/one-time-hpm-v1-cockpit.yml
          git commit -m 'feat(hpm): rebuild v1 as one-screen strategic workforce cockpit'
          git push origin HEAD:${GITHUB_REF_NAME}
