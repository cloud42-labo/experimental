name: Oekaki version sync

on:
  push:
    branches:
      - chris/oekaki-consolidate-111-112

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chris/oekaki-consolidate-111-112
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync package-lock version
        working-directory: kids-oekaki
        run: npm version 0.13.0 --no-git-tag-version --allow-same-version
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- kids-oekaki/package.json kids-oekaki/package-lock.json; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids-oekaki/package.json kids-oekaki/package-lock.json
          git commit -m "chore(oekaki): sync package lock to 0.13.0"
          git push origin HEAD:chris/oekaki-consolidate-111-112
