name: One-time HPM projection fix

on:
  push:
    branches:
      - claude/portfolio-index-reupload-rhy5at

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply projection fix
        shell: bash
        run: |
          cat > /tmp/hpm.patch <<'PATCH'
          --- a/human-capital-portfolio-management/index.html
          +++ b/human-capital-portfolio-management/index.html
          @@ -1067,18 +1067,20 @@
           function projectDeptOutcome(dept, share, stance, annualTotalBudget){
             const annualSpend = annualTotalBudget*share/100;
             const w=allocWeights(stance); const sum=Object.values(w).reduce((a,b)=>a+b,0);
          -  let hires=0, cost=0;
          +  let externalHires=0, promotions=0, transfers=0, cost=0;
             Object.keys(w).forEach(ch=>{
               const frac=w[ch]/sum;
               if(ch==='develop'||ch==='transfer'){
                 const pipelinePenalty = (ch==='develop' && dept==='store' && state.orgDesign.flexWork) ? LEADERSHIP_PIPELINE_PENALTY : 1;
          -      const cap=frac*BUILD_CAPACITY_MULT*engagementMult()*pipelinePenalty; hires+=cap; cost+=cap*(ch==='develop'?5:0); // 人ベース(供給元の制約)。カネでは買えない。実行(autoExecuteYear)と同じエンゲージメント補正・柔軟な勤務制度のパイプライン減速を適用し、⑤の見込みと⑥の実績を一致させる
          +      const cap=frac*BUILD_CAPACITY_MULT*engagementMult()*pipelinePenalty;
          +      if(ch==='develop'){ promotions+=cap; cost+=cap*5; } // 育成は既存社員の昇格であり人数純増ではない
          +      else transfers+=cap; // 異動は対象部門を増やすが、送り出し部門を同数減らすため全社純増ではない
               } else {
                 const chBudget=annualSpend*frac; const unit=channelCost(ch,dept); const suc=channelSuccess(ch,dept);
          -      const n= unit>0? chBudget/unit : 0; hires+=n*suc; cost+=n*unit;
          +      const n= unit>0? chBudget/unit : 0; externalHires+=n*suc; cost+=n*unit;
               }
             });
          -  return {annualSpend, expectedHires:hires, cost};
          +  return {annualSpend, expectedHires:externalHires, expectedPromotions:promotions, expectedTransfers:transfers, cost};
           }
           function vInvest(){
             const totalAnnual=state.budget, hz=horizonYears();
          @@ -1090,7 +1092,11 @@
               const a=state.alloc[d.id]; const eff=effectiveShare(d.id);
               const proj=projectDeptOutcome(d.id,eff,a.stance,totalAnnual);
               const need5=Math.max(0, demandAt(d.id,END_YEAR)-headcount(d.id));
          +    // 人数ギャップの充足率は会社全体の人数を実際に増やす外部採用だけで判定する。
          +    // 内部育成は昇格、内部異動は部門間の純移動なので、別指標として表示する。
               const projected5y=proj.expectedHires*hz;
          +    const projectedPromotions=proj.expectedPromotions*hz;
          +    const projectedTransfers=proj.expectedTransfers*hz;
               const fill= need5? clamp(projected5y/need5,0,1.5) : 1; const fillPct=Math.round(fill*100);
               const fillCol= fill>=1?'var(--ok)':fill>=0.7?'var(--warn)':'var(--bad)';
               const stanceHint = a.stance<=25
          @@ -1127,8 +1133,8 @@
                 <p class="small muted" style="margin:2px 0 8px">${stanceHint}</p>
                 ${rapidGrowthWarn}
                 <div class="row" style="justify-content:space-between">
          -        <span class="small">年間投資 ${Math.round(proj.annualSpend)}万円（予算${totalAnnual}万円の${Math.round(eff)}%） → 5年で期待調達 <b>${projected5y.toFixed(1)}名</b>（現場の実行結果次第で変動）</span>
          -        <span class="small">充足見込み <b style="color:${fillCol}">${fillPct}%</b></span>
          +        <span class="small">年間投資 ${Math.round(proj.annualSpend)}万円（予算${totalAnnual}万円の${Math.round(eff)}%） → 5年で外部採用純増 <b>${projected5y.toFixed(1)}名</b> ／ 内部育成 <b>${projectedPromotions.toFixed(1)}名</b>（昇格）／ 内部異動 <b>${projectedTransfers.toFixed(1)}名</b>（全社純増0・移動元は同数減）</span>
          +        <span class="small">人数純増の充足見込み <b style="color:${fillCol}">${fillPct}%</b></span>
                 </div>
                 <div class="meter"><span style="width:${Math.min(100,fillPct)}%;background:${fillCol}"></span></div>
               </div>`;
          PATCH
          git apply /tmp/hpm.patch
      - name: Verify projection invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('human-capital-portfolio-management/index.html').read_text(encoding='utf-8')
          assert 'expectedHires:externalHires' in s
          assert 'expectedPromotions:promotions' in s
          assert 'expectedTransfers:transfers' in s
          assert '人数純増の充足見込み' in s
          assert '内部異動 <b>${projectedTransfers.toFixed(1)}名</b>（全社純増0' in s
          a=s.index('<script>')+len('<script>'); b=s.rindex('</script>')
          Path('/tmp/hpm.js').write_text(s[a:b],encoding='utf-8')
          print('projection invariants: OK')
          PY
          node --check /tmp/hpm.js
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- human-capital-portfolio-management/index.html
          git rm -- .github/workflows/one-time-hpm-projection-fix.yml
          git commit -m 'fix(hpm): separate headcount hires from promotions and transfers'
          git push origin HEAD:${GITHUB_REF_NAME}
