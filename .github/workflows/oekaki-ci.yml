name: Oekaki CI

on:
  pull_request:
    paths:
      - 'kids-oekaki/**'
      - '.github/workflows/oekaki-ci.yml'
  push:
    branches:
      - 'feature/oekaki-*'
    paths:
      - 'kids-oekaki/**'
      - '.github/workflows/oekaki-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-oekaki
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kids-oekaki/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
