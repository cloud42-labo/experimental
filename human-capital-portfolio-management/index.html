<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人財ポートフォリオマネジメント</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e242c; --line:#2b333d;
    --text:#e7ecf1; --muted:#93a1af; --accent:#4a9eff; --accent2:#7c5cff;
    --ok:#37c07a; --warn:#f0b429; --bad:#f0576b; --radius:14px;
    --chart-a:#5aa9e6; --chart-b:#c48cff;
    --shadow:0 6px 20px rgba(0,0,0,.35);
    font-synthesis:none;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --panel:#fff; --panel2:#f0f3f7; --line:#e2e8f0; --text:#1a2230; --muted:#5b6b7d; --shadow:0 6px 20px rgba(20,30,50,.08);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  #app{max-width:1080px;margin:0 auto;padding:20px 18px 80px}
  h1{font-size:24px;margin:0 0 4px} h2{font-size:19px;margin:22px 0 10px}
  h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  p{margin:8px 0}
  .muted{color:var(--muted)} .small{font-size:13px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px;transition:.15s}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700;padding:13px 20px;font-size:16px}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  select,input{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .kpi .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi .v{font-size:22px;font-weight:800} .kpi .l{font-size:12px;color:var(--muted)}
  header.bar{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:-20px -18px 16px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
  .phasebar{display:flex;gap:0;align-items:center;flex-wrap:wrap;margin:0 0 18px}
  .phasebar .step{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .phasebar .step.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:700}
  .phasebar .step.done{color:var(--ok);border-color:var(--ok)}
  .phasebar .arrow{color:var(--muted);margin:0 4px;font-size:12px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .tag.ok{background:rgba(55,192,122,.15);color:var(--ok)} .tag.warn{background:rgba(240,180,41,.15);color:var(--warn)} .tag.bad{background:rgba(240,87,107,.15);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .meter{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden}
  .meter>span{display:block;height:100%;border-radius:999px}
  .deptcard{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);transition:.15s}
  .deptcard:hover{border-color:var(--accent)}
  .deptcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.25) inset}
  .alert{border-left:3px solid var(--line);padding:8px 12px;border-radius:8px;background:var(--panel2);margin:8px 0;font-size:14px}
  .alert.critical{border-color:var(--bad)} .alert.warning{border-color:var(--warn)} .alert.info{border-color:var(--accent)}
  .channelbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:10px 12px;width:100%}
  .channelbtn small{color:var(--muted);grid-column:1/-1}
  .center{text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:760px){ .split{grid-template-columns:1fr!important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   人財ポートフォリオマネジメント 5年計画版

   設計思想の二本柱：
   ①組織は戦略に従う（チャンドラーの命題） ②ゴーイングコンサーンという前提

   コアループ（7フェーズ、詳細はPHASE_STEPS参照）：
   ①事業戦略 → ②人財レントゲン(全体ポートフォリオ→放置シナリオ) →
   ③組織設計(中期経営計画=組織再編+人事アーキテクチャ。②の現状データが判断材料) →
   ④部門別ギャップ → ⑤投資配分(投資強度・部門シェア・build⇄buy・報酬水準) →
   ⑥経営(毎年,5年。事業転換戦略では余剰↔不足のリスキリング/リストラ判断も) → ⑦結果

   経営者が決めるのは「どこに・どれだけ・どんな方針で投資するか」。
   誰を何人どの経路で採るかは現場が市場を見ながら執行する。
   ①③は中期経営計画として期首に一度だけ決定し、5年間は原則動かさない。
   ========================================================================= */

// ---- 部門 ----
const DEPTS = [
  {id:'store', name:'店舗運営部', cat:'store',  desc:'店長・販売スタッフ。頭数と現場力。育成が長い'},
  {id:'md',    name:'商品部',     cat:'expert', desc:'バイヤー/MD。少数精鋭の目利き'},
  {id:'admin', name:'管理本部',   cat:'admin',  desc:'人事・経理・総務。安定需要'},
  {id:'ec',    name:'EC・デジタル部', cat:'digital', desc:'EC運営・デジタルマーケティングに加え、POS/社内システムの保守も兼務。少人数のため市場が常に逼迫'},
  {id:'mgmt',  name:'経営',       cat:'exec',   desc:'社長・後継者。5年で仕込めるか'},
];
const CAT_NAME = {store:'店舗系',expert:'専門職',admin:'管理系',digital:'デジタル',exec:'幹部'};
// 部門に新しく加わった人財（外部採用・内部異動・リスキリング）に付与する既定の役職。
const ROLE_BY_DEPT = {store:'販売',md:'MD',admin:'事務',ec:'情シス・デジタル担当',mgmt:'役員'};
// 内部異動・緊急人員融通で引き抜かれると部門の機能そのものが崩壊する希少な専門職役職。
// 対象部門にただ1人しかいない、育成に長い年月を要する目利き役割のため、他部門の頭数を
// 埋めるための駒として動かさない（動かせば、育成した後継パイプラインの意味がなくなる）。
const SCARCE_ROLES = ['バイヤー'];
// 採用市場の初期逼迫度(0-100) — params_market.md 準拠
const MARKET0 = {store:65, expert:75, admin:35, digital:85, exec:55};

// ---- 調達6経路 ----
// cost: 万円(概算 or 年収係数), lead: 戦力化までの年, base success率, fit(定着), build=内製
const CHANNELS = {
  develop:  {name:'内部育成',    build:true,  lead:2, success:.85, fit:.95, note:'既存社員を昇進・育成。安いが時間がかかる'},
  newgrad:  {name:'新卒採用',    build:false, lead:1, success:.80, fit:.85, cost:100, cat:'store',  note:'頭数と土台。戦力化に時間'},
  agency:   {name:'中途(エージェント)', build:false, lead:1, success:.80, fit:.85, feeRate:.33, note:'即戦力。手数料=想定年収の約33%'},
  headhunt: {name:'ヘッドハント', build:false, lead:1, success:.75, fit:.90, feeRate:.45, note:'幹部・専門職の切り札。年収の約45%'},
  referral: {name:'リファラル',   build:false, lead:0, success:.85, fit:.95, cost:25, note:'紹介。安く定着◎だが枠が社員数比例'},
  transfer: {name:'内部異動',     build:true,  lead:0, success:.70, fit:.85, cost:0, note:'部門間で人を動かす。供給元が薄くなる'},
};
// 内部育成/異動は「カネ」ではなく「人（供給元・育成担当のキャパ）」で頭打ちになる、という設計思想は保ちつつ、
// 積極出店のように需要曲線が急な戦略でも、配分を最大限に振り切れば追いつける範囲に上限を引き上げる
// （旧数値2.2では、店舗シェア95%まで振り切っても店舗充足率が6割弱にしかならず「配分の巧拙に関わらず
// 届かない天井」になっていた）。
const BUILD_CAPACITY_MULT = 2.2;
// 部門ごとの想定年収(万円) — エージェント/HH手数料の基準・給与総額の推定に使う
const DEPT_SALARY = {store:400, md:650, admin:450, ec:800, mgmt:1200};
const GRADE_MULT = {1:0.65, 2:0.85, 3:1.05, 4:1.35, 5:1.8}; // 等級による給与倍率(概算・正社員)
const PART_TIME_ANNUAL = 140; // パートの年間人件費(万円、概算週20時間×時給1,100円程度)。等級による倍率は適用しない
function empSalary(e){
  if(e.role==='パート') return Math.round(PART_TIME_ANNUAL*COMP_LEVELS[state.compLevel].payrollMult);
  return Math.round(DEPT_SALARY[e.dept]*GRADE_MULT[e.grade]*COMP_LEVELS[state.compLevel].payrollMult);
}
function payrollTotal(){return state.emps.reduce((s,e)=>s+empSalary(e),0)}
// 経営者が決める「人財投資の強度」＝総人件費に対する年間投資予算の比率
// 実務基準：採用+育成投資は人件費の3〜6%が目安(標準4%)。攻めるほど厚く張る。
const INVEST_LEVELS = {
  conservative:{name:'保守的',rate:0.03,desc:'人件費の3%。守りの経営。既存戦力の維持を優先'},
  standard:    {name:'標準',   rate:0.04,desc:'人件費の4%。一般的な水準でバランス良く投資'},
  aggressive:  {name:'積極',   rate:0.06,desc:'人件費の6%。攻めの経営。成長機会に厚く張る'},
};
// 報酬・処遇水準（新規レバー）：build/buyとは独立に「今いる人にいくら払うか」を決める。
// 上げれば人件費(＝投資予算の原資)が増える一方、エンゲージメント・定着率を直接底上げする。
const COMP_LEVELS = {
  standard:  {name:'市場並み', payrollMult:1.0,  engBonus:0,  turnoverMult:1.0, desc:'業界水準の報酬。追加コストなし。'},
  above:     {name:'やや高め', payrollMult:1.15, engBonus:5,  turnoverMult:0.85,desc:'人件費+15%。エンゲージメント・定着率が上がる。'},
  aggressive:{name:'積極的',   payrollMult:1.3,  engBonus:10, turnoverMult:0.7, desc:'人件費+30%。強い引き止め効果があるが、コスト負担も大きい。'},
};
// 人事アーキテクチャ（新規）：ジョブローテーション型かジョブ型固定か。
// 「内部異動」＝ローテーション的発想、「内部育成」＝ジョブ型的深化、という既存の区別を
// 経営者が明示的に選べる方針に格上げする。
const HR_ARCHITECTURE = {
  rotation: {name:'ジョブローテーション型', developMult:0.8, transferMult:1.8, succBonus:8,
    desc:'部門間異動を重視。経営層に必要な視野の広さが育ち、後継者育成が進みやすい。専門性の深掘りは遅くなる。'},
  balanced: {name:'バランス型',           developMult:1.0, transferMult:1.0, succBonus:0,
    desc:'内部異動と内部育成を半々で運用する標準的な方針。'},
  jobtype:  {name:'ジョブ型固定',         developMult:1.3, transferMult:0.5, succBonus:-8,
    desc:'専門領域での深化を重視。専門性は早く育つが、経営人材の視野が狭くなり後継者育成が遅れるリスク。市場価格への依存も強まる。'},
};
// 組織再編（軽い版）：重点事業に応じて対応部門を再編できる。「組織は戦略に従う」を体現する。
const FOCUS_TO_DEPT = {ec:'ec', md:'md', store:'store', cost:'admin'};
const ELEVATE_INFO = {
  ec:    {label:'EC・デジタル部を独立事業部に格上げ', cost:80,  desc:'EC運営と社内システム保守の兼務を解消し、EC専任化で意思決定が速くなり需要の伸びが加速する。独立事業部運営の管理コストが年間80万円かかる。'},
  md:    {label:'商品部を独立事業部に格上げ',         cost:50,  desc:'商品戦略の意思決定が速くなり伸びが加速する。管理コストが年間50万円かかる。'},
  store: {label:'店舗運営部をエリア事業部制に再編',    cost:60,  desc:'エリアごとの意思決定が速くなり出店ペースに対応しやすくなる。管理コストが年間60万円かかる。'},
  admin: {label:'管理本部をシェアードサービス化',      cost:-40, desc:'管理コストを圧縮できる（年間40万円の節約）が、各部門への専門的支援が薄くなるリスクがある。'},
};

// ---- 店舗運営部のリアル：女性比率・土日祝の壁・体力(30代)の壁 ----
// 現場実態（既存女性比率80.5%）に基づき、女性は育児等の事情で土日祝シフトに入れない
// 確率が相対的に高いという構造的制約を確率的にモデル化する（個人の属性で決め打ちはしない）。
const WEEKEND_OK_PROB = {F:0.6, M:0.9};
function assignWeekendOK(gender){ return rng() < (WEEKEND_OK_PROB[gender] ?? 0.8); }
const STORE_WEEKEND_FILL_THRESHOLD = 0.65; // これを下回ると土日の現場力が足りず、接客品質が落ちる
function weekendFillRate(){
  const emps=deptEmps('store');
  if(!emps.length) return 1;
  if(state.orgDesign.flexWork) return 1; // 柔軟な勤務制度が土日の壁そのものを解消する
  return emps.filter(e=>e.weekendOK).length / emps.length;
}
// 店舗現場の"30代の壁"：長時間の立ち仕事・品出し・レジ対応等の身体的負荷（腰痛等）により、
// 35歳を境に自発的離職リスクが跳ね上がる。「接客コンシェルジュ」への資格転換投資
// （単純作業から能動的な接客提案への転換）で、この身体的負荷への依存を解消できる。
function physicalStrainMult(e){
  if(e.dept!=='store' || state.orgDesign.concierge) return 1;
  return e.age>35 ? 1.6 : 1;
}
// 現場対応レバー（③組織設計で選ぶ、一度きりの投資）の年間コスト
const LEVER_INFO = {
  flexWork:  {label:'柔軟な勤務制度（曜日・時間を選べるシフト）を導入する', cost:30,
    desc:'土日祝に出られない社員が多くても、店舗運営に必要な現場力を確保できるようにする。土日の壁そのものを解消する一方、地域・時間を限定した働き方が広がる分、店舗運営部から次世代の管理職候補が育つペースが鈍る（全国異動・フル稼働を前提にした管理職登用と、柔軟な働き方は両立しにくいというトレードオフ）。'},
  concierge: {label:'「接客コンシェルジュ」資格制度に投資する', cost:40,
    desc:'単純作業員から、能動的にお客様へ提案する接客のプロへの転換。体力的負荷への依存が減り、35歳以降の離職リスクが解消される。'},
};
// 柔軟な勤務制度は店舗運営部の定着・現場力を助ける一方、店舗運営部からの管理職(等級4以上)への
// 昇格ペースを鈍らせる。次世代経営層(後継者候補)のパイプラインが、働き方の柔軟性とトレードオフに
// なるという現実を反映する。
const LEADERSHIP_PIPELINE_PENALTY = 0.6;

// ---- EC・デジタル部：システムベンダ丸投げ か 内製化・DXシナジー か ----
// build/buyのスタンスと人事アーキテクチャの組み合わせで、EC部門が「ベンダー依存」
// 「内製化途上」「DXシナジー達成」のどの状態にあるかを判定する。
function ecFillRatio(){ const dem=demandAt('ec', state.year); return dem? headcount('ec')/dem : 1; }
function ecState(){
  const stance=state.alloc.ec.stance, fill=ecFillRatio();
  if(state.orgDesign.hrArchitecture==='jobtype' && stance<=30 && fill>=0.65) return 'dx';
  if(stance>=60 || fill<0.5) return 'vendor';
  return 'building';
}
const EC_STATE_INFO = {
  vendor:   {label:'⚠️ ベンダー丸投げ', color:'var(--bad)',  desc:'外部委託・パッケージ依存の状態。変化対応が遅く、市場逼迫の影響を直に受け、コストも高止まりする。'},
  building: {label:'⚙️ 内製化途上',    color:'var(--warn)', desc:'内製化を進めている途中。もう一段、build比重と充足率を上げるとDXシナジーが狙える。'},
  dx:       {label:'🚀 DXシナジー発動', color:'var(--ok)',   desc:'情シス・データ分析の内製化を達成。店舗・商品部へのデータ支援が発動し、全社の売上成長・粗利を押し上げる。'},
};

// ---- 事業成果（カネ）：人財の状態が年商・粗利率・営業利益に直結する ----
// 年商8.6億円は、姉妹プロダクト「企業経営シミュレーション」の坪単価(竹=60坪,定常月商720万円)
// ×10店舗×12ヶ月から逆算した基準値。粗利率は45〜54%のレンジで、店舗の土日充足率・商品部の
// バイヤー承継・EC部のDX状態の3つによって毎年変動する（人財への投資と定着の失敗が、
// そのまま数億円規模の機会損失＝カネの赤字を生むことを可視化するのが狙い）。
const BASE_ANNUAL_REVENUE = 86400; // 万円(=8.64億円)
const BASE_GROWTH = 0.03;          // 何も特筆すべき問題がなければ年3%の自然成長
const MARGIN_BASE = 0.52, MARGIN_MIN = 0.45, MARGIN_MAX = 0.54;
// 創業10年目＝すでに10年間安定運営してきた会社という前提のため、家賃・固定費は新規出店直後の
// 水準ではなく、長期契約・運営効率化が進んだ後の水準とする。これにより開始時点の営業利益は
// 黒字（約2,000万円）となる——「会社は回っている」という前提と矛盾しないようにするための調整。
const RENT_PER_STORE_MONTH = 75;   // 万円/店舗/月
const FIXED_SGA = 1800;            // 万円/年。家賃以外の固定的な販管費(概算)
const IDEAL_GROWTH = 0.06, IDEAL_MARGIN = 0.54; // 人財投資が理想的に機能した場合の参考値(機会損失の算出基準)
const BUYER_AGE_WARN_THRESHOLD = 50; // バイヤーの目利き承継が急務とみなす平均年齢の閾値(②④⑦の全画面で共通)
function storeRentAnnual(){ return Math.round(storeCountNow()*RENT_PER_STORE_MONTH*12); }
function mdSuccessionOk(){ return state.emps.some(e=>e.dept==='md'&&e.grade>=2&&e.age<40&&e.role!=='バイヤー'); }
function computeYearFinance(){
  const f=state.finance;
  let growth=BASE_GROWTH, margin=MARGIN_BASE;
  // 店舗運営部が壊滅的に不足すると、そもそも店舗が営業できず売上に直撃する。
  // 土日充足率(現場品質)とは別に、頭数そのものの崩壊を売上成長率に直接反映させる。
  const storeFillRatio = demandAt('store',state.year) ? headcount('store')/demandAt('store',state.year) : 1;
  if(storeFillRatio<0.3){ growth-=0.09; state.log.push(`店舗運営部：要員充足率${Math.round(storeFillRatio*100)}%で、営業を維持できない店舗が発生しています。売上に深刻な打撃が出ています。`); }
  else if(storeFillRatio<0.5){ growth-=0.045; state.log.push(`店舗運営部：要員充足率${Math.round(storeFillRatio*100)}%で複数店舗の営業に支障が出ており、売上が大きく落ち込んでいます。`); }
  const wfr=weekendFillRate();
  if(wfr<STORE_WEEKEND_FILL_THRESHOLD){ growth-=0.025; state.log.push(`店舗運営部：土日充足率${Math.round(wfr*100)}%で接客品質が低下し、機会損失が発生しています。`); }
  else if(wfr>=0.85){ growth+=0.005; }
  // 商品部：バイヤーが1人もいない状態は「高齢化」より悪い「目利きの完全消失」であり、別枠で重く扱う
  const buyerCount=deptEmps('md').filter(e=>e.role==='バイヤー').length;
  const buyerAvg=avg(deptEmps('md').filter(e=>e.role==='バイヤー').map(e=>e.age));
  if(buyerCount===0){ margin-=0.04; state.log.push('商品部：バイヤーが不在です。仕入れの目利きが完全に失われ、商品力が大きく低下しています。'); }
  else if(buyerAvg>=BUYER_AGE_WARN_THRESHOLD && !mdSuccessionOk()){ margin-=0.02; state.log.push('商品部：バイヤーの目利きの継承が進まず、商品力低下が粗利を圧迫しています。'); }
  else if(mdSuccessionOk()){ margin+=0.005; }
  const es=ecState();
  if(es==='dx'){ growth+=0.03; margin+=0.03; state.log.push('EC・デジタル部：内製化によるDXシナジーが発動し、全社の売上・粗利を押し上げています。'); }
  else if(es==='vendor'){ margin-=0.02; growth-=0.01; }
  if(state.orgDesign.concierge) margin+=0.01;
  if(state.praiseBoost){ growth+=0.01; state.praiseBoost=false; state.log.push('表彰制度で刺激されたアニマルスピリットが、今年の店舗運営品質を一時的に押し上げました。'); } // 表彰制度の一時バフ
  margin=clamp(margin, MARGIN_MIN, MARGIN_MAX);
  const prevRevenue=f.revenue;
  f.revenue=Math.max(1000, Math.round(f.revenue*(1+growth)));
  f.marginRate=margin;
  f.grossProfit=Math.round(f.revenue*margin);
  const overhead=storeRentAnnual()+FIXED_SGA;
  f.opProfit=f.grossProfit-payrollTotal()-overhead;
  const idealRevenue=Math.round(prevRevenue*(1+IDEAL_GROWTH));
  const idealProfit=Math.round(idealRevenue*IDEAL_MARGIN)-payrollTotal()-overhead;
  f.cumOppLossManYen=(f.cumOppLossManYen||0)+Math.max(0, idealProfit-f.opProfit);
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(a,b){return Math.floor(rng()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

// Year10時点の初期従業員数（newGame()のロスター生成合計と一致させること：
// 店舗50〈店長10+副店長5+販売25+パート10〉+商品6+管理本部8+EC2+経営3＝69）

// state（＝実際のランダム化されたロスター）がまだ存在しないため、参考値として定数化する。
// 一部ロール（店舗の販売職）の等級は個体差でランダムに決まるため実際の値とは若干ずれうるが、
// 黒字基調が変わるほどの振れ幅ではない（実測 約+0.21億円、本定数はそれに合わせた参考値）。
const INITIAL_OP_PROFIT_MANYEN = 2056;
const STORES_PER_YEAR = { aggressive:2, standard:1, focus:0, pivot:-1 }; // 成長方針ごとの年間出店ペース（pivotは店舗を段階的に縮小）
function storeOpenPace(s, org){
  org = org || {elevated:{}};
  return STORES_PER_YEAR[s.expansion] * (org.elevated.store ? 1.5 : 1); // エリア事業部制に再編すると出店ペースが加速
}
function computeDemand(s, org){
  org = org || {elevated:{}};
  const f = k => s.focuses.includes(k)?1:0;
  const elevMult = dep => org.elevated[dep] ? 1.3 : 1; // 組織再編を実施した部門は、戦略の効果がさらに増幅する
  const openPace = storeOpenPace(s, org);
  const qualityBoost = f('store') ? 1.25 : 1; // 重点事業「店舗運営品質」は出店ペースではなく1店舗あたりの人員厚みに効く
  const d = {store:[],md:[],admin:[],ec:[],mgmt:[]};
  const isPivot = s.expansion==='pivot';
  const chronicGap = isPivot ? 0 : 3; // pivot(店舗縮小)では「慢性的な採用不足」の前提が逆転するため外す
  for(let i=0;i<6;i++){
    const stores = Math.max(3, BASE_STORE_COUNT + openPace*i); // 縮小しても最低限の店舗網は残す
    d.store.push(Math.max(0, Math.round(stores*PEOPLE_PER_STORE*qualityBoost) + chronicGap));
    d.md.push(   Math.round(6  + i*(0.2 + f('md')*0.55*elevMult('md'))));
    d.ec.push(   Math.round(3  + i*(0.5 + f('ec')*1.7*elevMult('ec') + (isPivot?0.9:0)))); // 事業転換はEC需要をそれ自体で押し上げる
    d.admin.push(Math.max(4, Math.round(8 + i*0.25 - f('cost')*i*0.55*elevMult('admin'))));
    d.mgmt.push(4);
  }
  return d;
}
// 店舗数：出店計画（年◯店ペース）から算出する目標トラジェクトリと、

// 「戦略で描いた出店計画」と「現場が実際に人を揃えられたか」のズレを、店舗数という単位でも見せるため。

}

  state.actual = {}; DEPTS.forEach(d=>state.actual[d.id]=0); // 実行フェーズでの実際の調達数（現場の結果）
  state.hireCarry = {}; // 部門×チャネルごとの採用人数の端数繰り越し。乱数での丸め(rng()<remで+1)だと
  // 配分をわずかに変えただけで閾値をまたぎスコアが乱高下したため、端数を毎年蓄積して閾値を
  // 超えたら+1人発生させる決定論的な丸めに統一し、配分の変化に対してなめらかに反応させる。
  state.cum = {retired:0, left:0, failed:0, restructured:0, mdInternalYears:0}; // 想定外の累計（計画と現実の乖離）。mdInternalYearsは商品部が内部育成重視だった年数（⑤は毎年見直せるため、経営者力量審判「③繋ぐ力」は最終年のスナップショットではなく5年間の実績で判定する）
  state.restructureShockYears=0; // リストラ直後は動揺で離職が増える(ショック期間)
  state.planSnapshot = null; // 投資配分を確定した時点の期待値（結果画面で実績と比較）
  // Year10時点の人財ポートフォリオを凍結保存（結果画面で「②で見せた現在の構成比が5年でどうなったか」を比較するため）
  state.initialEmps = state.emps.map(e=>({...e}));
  state.initialStats = portfolioStats(state.initialEmps);
  // 事業成果（カネ）：年商8.6億円を起点に、粗利率50%で開始する
  state.finance = {revenue:BASE_ANNUAL_REVENUE, marginRate:MARGIN_BASE, grossProfit:0, opProfit:0, cumOppLossManYen:0};
  state.finance.grossProfit = Math.round(state.finance.revenue*state.finance.marginRate);
  recomputeBudget();
  state.finance.opProfit = state.finance.grossProfit - payrollTotal() - (storeRentAnnual()+FIXED_SGA);
  state.initialFinance = {...state.finance};
}
function shareSum(){return DEPTS.reduce((s,d)=>s+state.alloc[d.id].share,0)}
function orgOverheadCost(){
  const leverCost=Object.keys(LEVER_INFO).filter(k=>state.orgDesign[k]).reduce((s,k)=>s+LEVER_INFO[k].cost,0);
  return leverCost + Object.keys(state.orgDesign.elevated).filter(k=>state.orgDesign.elevated[k])
    .reduce((s,k)=>s+(ELEVATE_INFO[k]?.cost||0),0);
}
function recomputeBudget(){ // 年間の人財投資予算(万円) = 総人件費 × 投資強度 − 組織再編の管理コスト（経営者が決める）
  state.budget = Math.max(0, Math.round(payrollTotal()*INVEST_LEVELS[state.investLevel].rate) - orgOverheadCost());
}
function deptEmps(d){return state.emps.filter(e=>e.dept===d)}
function headcount(d){return deptEmps(d).length}
function demandAt(d,y){return state.demand[d][y-START_YEAR]}

// 供給見込み(無策): 現有から毎年 定年(>=65)と離職(概算)を引く
function supplyForecast(d){
  const out=[]; let list=deptEmps(d).map(e=>({...e}));
  for(let y=START_YEAR;y<=END_YEAR;y++){
    if(y>START_YEAR){
      list.forEach(e=>e.age++);
      list=list.filter(e=>e.age<65); // 定年
      const attr = d==='store'?0.12:0.09;
      // 乱数(rng())は使わない：この関数は④部門別ギャップ画面のプレビュー計算として
      // レンダリングのたびに何度も呼ばれるため、rng()を消費すると同じ乱数列を共有する
      // 本編の採用成功率・離職判定・市場変動まで、見るだけの操作で結果が変わってしまう。
      // projectRoster()と同じ「低ポテンシャル層から決定論的に間引く」方式に統一する。
      // 30代の壁(physicalStrainMult)は③組織設計(接客コンシェルジュ投資)の直後に見る画面のため反映する。
      const avgStrain = list.length ? list.reduce((s,e)=>s+physicalStrainMult(e),0)/list.length : 1;
      const remove=Math.round(list.length*attr*0.6*avgStrain); // 概算離職(予測なので控えめ)
      list=list.slice().sort((a,b)=>a.pot-b.pot).slice(remove);
    }
    out.push(list.length);
  }
  return out;
}
// 計画込み供給(pending着任を上乗せ)
function supplyWithPlan(d){
  const base=supplyForecast(d);
  const arrivals={}; state.pending.filter(p=>p.dept===d).forEach(p=>{arrivals[p.arrive]=(arrivals[p.arrive]||0)+1});
  let cum=0; return base.map((v,i)=>{const y=START_YEAR+i; cum+=arrivals[y]||0; return v+cum});
}
function gapAt(d,y){return demandAt(d,y)-headcount(d)} // 今年の即時ギャップ(簡易)

/* ---------- 採用市場が調達に効く ---------- */
function tight(cat){return clamp(state.market[cat],0,100)}
function vendorAmplifier(dept){ return dept==='ec' && ecState()==='vendor' ? 1.35 : 1; } // ベンダー丸投げ状態は市場逼迫の影響をより強く受ける
function channelCost(chId,dept){
  const c=CHANNELS[chId]; const cat=DEPTS.find(d=>d.id===dept).cat; const t=tight(cat)/100*vendorAmplifier(dept);
  if(c.build) return chId==='develop'?5:0;
  if(c.feeRate) return Math.round(DEPT_SALARY[dept]*c.feeRate*(1+t*0.4));
  return Math.round((c.cost||80)*(1+t*0.5));
}
function channelSuccess(chId,dept){
  const c=CHANNELS[chId]; const cat=DEPTS.find(d=>d.id===dept).cat; const t=tight(cat)/100*vendorAmplifier(dept);
  let s=c.success*(c.build?1:(1-t*0.45))*engagementMult(); return clamp(s,0.15,0.97);
}
function referralCap(){return Math.max(1,Math.round(state.emps.length*0.06))} // 枠=社員数の6%

/* ============================ SIMULATION ============================ */
// 現場の実行：経営者が決めた配分方針(share/stance)＋②で決めた人事アーキテクチャに沿って、
// 実際に誰をどう採るかを執行する。経営者はこのロジックを直接操作しない＝「何人どこから」は現場の仕事。
function allocWeights(stance){
  const build=100-stance, buy=stance;
  const arch=HR_ARCHITECTURE[state.orgDesign.hrArchitecture];
  return { develop:build*1.0*arch.developMult, transfer:build*0.4*arch.transferMult, referral:30, newgrad:buy*0.5, agency:buy*0.6, headhunt:buy*0.3 };
}
function completeDevelopment(t){
  const dept=t.dept; const fromRole=t.role;
  t.grade++;
  // 店舗運営部：パート→販売(正社員登用)→副店長(昇格)
  if(dept==='store'){
    if(fromRole==='パート'&&t.grade>=2) t.role='販売';
    else if(fromRole==='販売'&&t.grade>=3) t.role='副店長';
  }
  // 商品部：若手候補→MD→バイヤー
  else if(dept==='md'){
    if((fromRole==='若手バイヤー候補'||fromRole==='MDプランナー')&&t.grade>=3) t.role='MD';
    else if(fromRole==='MD'&&t.grade>=4) t.role='バイヤー';
  }
}
function autoExecuteYear(){
  const totalBudget=state.budget;
  state._buildHiresThisYear=0;
  const referralAnnualCap=referralCap();
  let referralAttemptsThisYear=0;
  const developmentQueuedIds=new Set(state.developmentQueue.map(p=>p.empId));
  DEPTS.forEach(d=>{
    const dept=d.id; const stance=state.alloc[dept].stance;
    const annualSpend=totalBudget*effectiveShare(dept)/100;
    const w=allocWeights(stance); const sum=Object.values(w).reduce((a,b)=>a+b,0);
    // 個々の採用試行を1件ずつログに出すと「現場からの報告」が数十行の羅列になり読めなくなるため、
    // 部門ごとに1件のサマリー行へ集約する（誰が何をしたかの詳細はstate.actual/state.pendingで追える）。
    let developStarted=0, transfer=0, hireSuccess=0, hireFail=0;
    ['develop','transfer'].forEach(ch=>{
      const frac=w[ch]/sum;
      // 柔軟な勤務制度は店舗運営部の内部育成(昇格)ペースを鈍らせる（次世代経営層パイプラインとのトレードオフ）
      const pipelinePenalty = (ch==='develop' && dept==='store' && state.orgDesign.flexWork) ? LEADERSHIP_PIPELINE_PENALTY : 1;
      const capacity=frac*BUILD_CAPACITY_MULT*engagementMult()*pipelinePenalty; // エンゲージメントが内製化(育成・異動)のスピードを左右する
      const carryKey=dept+':'+ch; const carryTotal=capacity+(state.hireCarry[carryKey]||0);
      const n=Math.floor(carryTotal); state.hireCarry[carryKey]=carryTotal-n;
      for(let i=0;i<n;i++){
        if(ch==='develop'){
          // 内部育成はCHANNELS.develop.leadを必ず待つ。同年昇格させず、育成中の同一人物を重複登録しない。
          const t=deptEmps(dept).filter(e=>e.grade<4&&!developmentQueuedIds.has(e.id)).sort((a,b)=>b.pot-a.pot)[0];
          if(t){
            developmentQueuedIds.add(t.id);
            state.developmentQueue.push({empId:t.id,dept,arrive:state.year+CHANNELS.develop.lead});
            developStarted++;
          }
        } else {
          const from=state.emps.filter(e=>e.dept!==dept&&e.role!=='社長'&&!SCARCE_ROLES.includes(e.role)&&e.dept!=='mgmt'&&!developmentQueuedIds.has(e.id)).sort((a,b)=>headcount(b.dept)-headcount(a.dept))[0];
          if(from){from.dept=dept; from.role=ROLE_BY_DEPT[dept]; state.actual[dept]=(state.actual[dept]||0)+1; state._buildHiresThisYear++; transfer++;}
        }
      }
    });
    ['newgrad','agency','headhunt','referral'].forEach(ch=>{
      const frac=w[ch]/sum; const chBudget=annualSpend*frac; const unit=channelCost(ch,dept);
      if(unit<=0) return;
      const carryKey=dept+':'+ch; const carryTotal=chBudget/unit+(state.hireCarry[carryKey]||0);
      let n=Math.floor(carryTotal); state.hireCarry[carryKey]=carryTotal-n;
      if(ch==='referral'){ const capLeft=referralAnnualCap-referralAttemptsThisYear; n=Math.min(n,Math.max(0,capLeft)); referralAttemptsThisYear+=n; }
      for(let i=0;i<n;i++){
        const ok=rng()<channelSuccess(ch,dept);
        if(ok){
          const c=CHANNELS[ch]; const arrive=state.year+c.lead;
          const hire={dept,ch,role:ROLE_BY_DEPT[dept],arrive,grade: ch==='headhunt'?4:2, age: ch==='newgrad'?23:ri(28,42)};
          if(c.lead===0){
            const gender = dept==='store' ? (rng()<.2?'M':'F') : (rng()<.5?'M':'F');
            const ne={id:'e'+Math.floor(rng()*99999)+i,dept,role:hire.role,age:hire.age,grade:hire.grade,gender,pot:0.5,name:name(gender)};
            if(dept==='store') ne.weekendOK=assignWeekendOK(gender);
            state.emps.push(ne);
          }
          else { state.pending.push(hire); }
          state.actual[dept]=(state.actual[dept]||0)+1; hireSuccess++;
        } else { state.cum.failed++; hireFail++; }
      }
    });
    const parts=[];
    if(developStarted) parts.push(`内部育成${developStarted}名開始（${CHANNELS.develop.lead}年後に昇格）`);
    if(transfer) parts.push(`内部異動${transfer}名`);
    if(hireSuccess) parts.push(`外部採用${hireSuccess}件成立`);
    if(hireFail) parts.push(`採用${hireFail}件が市場逼迫で不成立`);
    if(parts.length) state.log.push(`${d.name}：${parts.join('・')}`);
  });
  emergencyBackfill();
}
// 緊急対応：市場で採用できず・方針上も内部異動を絞っていても、業務が止まる寸前の部門には
// 最低限の人員を強制的に融通する。「ジョブ型を標榜していても、現場は方針を破ってでも人を回す」
// という現実を反映する。ジョブ型固定の場合は方針との矛盾としてログに残り、エンゲージメントも削れる。
function emergencyBackfill(){
  DEPTS.forEach(d=>{
    if(d.id==='mgmt') return; // 経営(後継者)は個別の忠誠度で別途扱う
    const dem=demandAt(d.id, state.year);
    const fillRatio = dem? headcount(d.id)/dem : 1;
    if(fillRatio>=0.6) return; // 致命的な不足でなければ通常運用のまま
    const from=state.emps.filter(e=>e.dept!==d.id&&e.role!=='社長'&&!SCARCE_ROLES.includes(e.role)&&e.dept!=='mgmt')
      .sort((a,b)=>headcount(b.dept)-headcount(a.dept))[0];
    if(!from) return;
    const prevDept=from.dept; from.dept=d.id; from.role=ROLE_BY_DEPT[d.id];
    state.actual[d.id]=(state.actual[d.id]||0)+1;
    state.cum.emergencyTransfers=(state.cum.emergencyTransfers||0)+1;
    const isJobtype=state.orgDesign.hrArchitecture==='jobtype';
    const archName=HR_ARCHITECTURE[state.orgDesign.hrArchitecture].name;
    state.log.push(`${d.name}：要員充足率${Math.round(fillRatio*100)}%で業務継続が困難。${isJobtype?`「${archName}」方針に反してでも、`:''}${CAT_NAME[DEPTS.find(x=>x.id===prevDept).cat]}から緊急に人員を融通しました。`);
    if(isJobtype) state.engagement=Math.round(clamp(state.engagement-3,5,95)); // 方針と現実の矛盾が組織に軋みを生む
  });
}
function advanceYear(){
  const y=state.year;
  state.log=[];
  // 経営者力量審判「③繋ぐ力」の商品部条件は、最終年のスナップショットではなくこの5年間で
  // 実際に内部育成重視だった年数の積み上げで判定する（この年の執行前の時点のスタンスを計上）。
  if(state.alloc.md.stance<=40) state.cum.mdInternalYears=(state.cum.mdInternalYears||0)+1;
  // 現場が今年の配分方針を執行する（経営者は方針だけ決め、実行結果は事後に分かる）
  autoExecuteYear();
  // pending 着任
  const arrived=state.pending.filter(p=>p.arrive===y+1);
  // 加齢・退職・離職（エンゲージメントが低いほど離職率が上がる＝悪循環/好循環のフィードバック。
  // 報酬・処遇水準(comp)も定着率に直接効く＝build/buyとは独立したもう1本のレバー）
  let retired=0,left=0; const preCount=state.emps.length;
  const engFactor=clamp(1.6-state.engagement/100, 0.6, 1.6);
  const compTurnoverMult=COMP_LEVELS[state.compLevel].turnoverMult;
  const restructureShockMult = state.restructureShockYears>0 ? 1.25 : 1; // リストラ直後は組織不安で自発的離職が増える
  state.emps.forEach(e=>e.age++);
  state.emps=state.emps.filter(e=>{
    if(e.role==='社長') return true; // 社長は承継処理で扱う
    if(e.id===state.successor) return true; // 後継者は定年の一律離脱対象からも除外し、個別の忠誠度だけで扱う(下で処理)
    if(e.age>=65){retired++;return false}
    const attr=(e.dept==='store'?0.12:0.09)*engFactor*compTurnoverMult*restructureShockMult*physicalStrainMult(e);
    if(rng()<attr){left++;return false}
    return true;
  });
  // CHANNELS.develop.leadを満たした内部育成だけを昇格へ反映する。途中離職した人は昇格しない。
  const developed=state.developmentQueue.filter(p=>p.arrive===y+1);
  let developmentCompleted=0;
  developed.forEach(p=>{
    const t=state.emps.find(e=>e.id===p.empId);
    if(!t) return;
    completeDevelopment(t);
    state.actual[t.dept]=(state.actual[t.dept]||0)+1;
    state._buildHiresThisYear=(state._buildHiresThisYear||0)+1;
    developmentCompleted++;
  });
  const liveIds=new Set(state.emps.map(e=>e.id));
  state.developmentQueue=state.developmentQueue.filter(p=>p.arrive>y+1&&liveIds.has(p.empId));
  if(state.restructureShockYears>0) state.restructureShockYears--;
  // 着任を反映（店舗運営部は現場の性別構成比に合わせ、土日可否も新規に割り当てる）
  arrived.forEach(p=>{
    const gender = p.dept==='store' ? (rng()<.2?'M':'F') : (rng()<.5?'M':'F');
    const e={id:'e'+(Date.now()%100000)+Math.floor(rng()*999),dept:p.dept,role:p.role,age:p.age||ri(25,40),grade:p.grade||2,gender,pot:0.5,name:name(gender)};
    if(p.dept==='store') e.weekendOK=assignWeekendOK(gender);
    state.emps.push(e);
  });
  state.pending=state.pending.filter(p=>p.arrive>y+1);
  state.cum.retired+=retired; state.cum.left+=left;
  // エンゲージメントの更新：離職の多さ・要員不足の深刻さ・投資方針(build/buy)・報酬水準・実際の内製登用が効く
  {
    const leftRatio = preCount? left/preCount : 0;
    const gapSeverity = avg(DEPTS.map(d=>{const dem=demandAt(d.id,Math.min(y+1,END_YEAR)); const need=Math.max(0,dem-headcount(d.id)); return dem? need/dem : 0;}));
    const buyLean = DEPTS.reduce((s,d)=>s+effectiveShare(d.id)/100*state.alloc[d.id].stance,0); // 0(内製寄り)〜100(外部調達寄り)
    const wfr=weekendFillRate();
    const weekendPenalty = wfr<STORE_WEEKEND_FILL_THRESHOLD ? (STORE_WEEKEND_FILL_THRESHOLD-wfr)*40 : 0; // 頭数が足りていても土日の壁があれば現場品質が落ちる
    // 何もしなければエンゲージメントは毎年じわじわ目減りする（組織の自然なエントロピー）。
    // 人心掌握度が高いほどこの目減りが緩み、100近くではむしろ底上げに転じる。経営・管理本部(本社)は
    // 現場(店舗・商品・EC)より社長との接点が多いため、この人心掌握度の効果をより強く受ける。
    const hqCount = headcount('admin')+headcount('mgmt'), fieldCount = headcount('store')+headcount('md')+headcount('ec');
    const hqShare = (hqCount+fieldCount)? hqCount/(hqCount+fieldCount) : 0;
    const charismaRelief = clamp((state.charisma-50)/50, -1, 1); // -1(人心掌握度0)〜0(50)〜+1(100)
    const decayMult = clamp(1 - charismaRelief*1.2, -0.5, 2.2); // 人心掌握度が高いほど目減りが緩む/むしろ上向く、低いほど目減りが加速する
    const naturalDecay = hqShare*(ENGAGEMENT_BASE_DECAY*HQ_CHARISMA_SENSITIVITY*decayMult) + (1-hqShare)*(ENGAGEMENT_BASE_DECAY*FIELD_CHARISMA_SENSITIVITY*decayMult);
    let engDelta = -leftRatio*60 - gapSeverity*20 + (50-buyLean)*0.12 + Math.min(5,(state._buildHiresThisYear||0)) + COMP_LEVELS[state.compLevel].engBonus - weekendPenalty - naturalDecay;
    state.engagement = Math.round(clamp(state.engagement+engDelta, 5, 95));
  }
  // 後継者育成進捗 ＋ 個別の忠誠度（会社全体のエンゲージメントとは別に、
  // このキーパーソン個人の定着リスクを可視化する。見えないサイコロで理不尽に消えないようにする）
  if(state.successor){
    const s=state.emps.find(e=>e.id===state.successor);
    if(!s){ state.successor=null; state.succProgress=0; state.successorLoyalty=0; }
    else {
      // 経営(mgmt)への投資を内製(build)寄りにするほど後継者育成が進み、忠誠度も上がる。
      // 人事アーキテクチャがジョブローテーション型だとさらに育成が進み(視野が育つ)、
      // ジョブ型固定だと遅れる（専門特化を優先した代償）。あわせて後継者本人の潜在力(pot)も
      // 一定の効果を持たせる（プロフィールで見せている以上、選ぶ意味を持たせるため）。
      // ただし主役はあくまで経営者の投資判断であって天性の資質ではない、という設計思想を
      // 保つため、影響は控えめに留める。
      const mgmtStance=state.alloc.mgmt.stance;
      const buildFrac=1-mgmtStance/100;
      const archBonus=HR_ARCHITECTURE[state.orgDesign.hrArchitecture].succBonus;
      const potBonus=Math.round((s.pot-0.5)*20); // pot0.4〜0.9の範囲でおよそ-2〜+8
      const inc=Math.round(10+buildFrac*30+archBonus)+potBonus; // 内製寄り(stance=0)なら+40、外部寄り(stance=100)なら+10、これに人事方針・本人の潜在力の補正が乗る
      state.succProgress=clamp(state.succProgress+inc,0,100);
      let loyDelta = buildFrac*12 - Math.max(0,55-state.engagement)*0.4; // 会社全体の空気が悪いと個人の忠誠度も下がる(波及)
      if(state.successorBoosted){ loyDelta+=15; state.successorBoosted=false; } // 「厚遇する」を使った年は上乗せ
      state.successorLoyalty=Math.round(clamp((state.successorLoyalty??65)+loyDelta,0,100));
      // 忠誠度が低いほど、この人個人が離脱するリスクが上がる（見える化された個別リスク）。
      // 70以上を維持できていればリスクはゼロ＝正しく手を打てば確実に守れる、という納得感を優先する。
      if(rng() < clamp((70-state.successorLoyalty)/100,0,1)*0.35){
        state.log.push(`後継者（${s.name}）の忠誠度が限界に達し、離脱しました。`);
        state.emps=state.emps.filter(e=>e.id!==state.successor);
        state.successor=null; state.succProgress=0; state.successorLoyalty=0;
      }
    }
  }
  // 市場変動(小さくドリフト。デジタルは高止まり)
  Object.keys(state.market).forEach(k=>{ let d=(rng()-0.5)*10; if(k==='digital')d=Math.max(d,0)*0.5+2; state.market[k]=clamp(state.market[k]+d, k==='digital'?70:20, 95)});
  // 事業成果（カネ）：土日充足率・バイヤー承継・ECのDX状態が、今年の売上成長率と粗利率を左右する
  computeYearFinance();
  state.year++;
  recomputeBudget();
  if(developmentCompleted)state.log.push(`内部育成 ${developmentCompleted}名が昇格`);
  if(retired)state.log.push(`定年退職 ${retired}名`); if(left)state.log.push(`離職 ${left}名`); if(arrived.length)state.log.push(`入社(着任) ${arrived.length}名`);
  snapshot();
  state.charismaActionUsed=false; // 人心掌握アクションは年1回まで。年が進んだらリセットする
  state.plannedTransferUsed=false; // 計画的な人財配転も年1回まで。年が進んだらリセットする
  if(state.year>=END_YEAR){ resolveEnding(); return; } // Year15到達＝5年分の実行が完了した時点で即終了（6年目分の"おまけラウンド"を発生させない）
  state.phase='year';
}
function resolveEnding(){
  // 承継判定
  let succ = state.succProgress>=70?'smooth':state.succProgress>=30?'rocky':'fail';
  state.ending = succ;
  state.phase='result';
}
// state.year はこの時点ですでに翌年へ進んでいるため、concludedYear=state.year-1 が「今終わった年」
function snapshot(){
  const concludedYear=state.year-1;
  state.history.push({
    year:concludedYear, label:planYear(concludedYear)+'年目',
    headcount:Object.fromEntries(DEPTS.map(d=>[d.id,headcount(d.id)])),
    revenue:state.finance.revenue, marginRate:state.finance.marginRate, opProfit:state.finance.opProfit,
    engagement:state.engagement, charisma:state.charisma,
    log:state.log.slice(),
  });
}

/* ============================ DIAGNOSIS ============================ */
// 現状把握（③人財レントゲン）の診断：会社全体・後継者・エンゲージメントなど「今の状態」に関するもの。
// ②組織設計の判断材料としても使われるため、組織設計より前のフェーズに置く。
function diagnosePortfolio(){
  const a=[];
  const youngSM=state.emps.filter(e=>e.dept==='store'&&e.grade>=3&&e.age<38).length;
  if(youngSM===0) a.push({s:'critical',m:'店舗運営部：38歳未満の店長・候補がゼロ。出店計画に対し内部昇進が枯れています。'});
  const buyerCount=deptEmps('md').filter(e=>e.role==='バイヤー').length;
  const buyerAvg=avg(deptEmps('md').filter(e=>e.role==='バイヤー').map(e=>e.age)); // バイヤー職のみの平均(MD/若手枠を含めない)
  if(buyerCount===0) a.push({s:'critical',m:'商品部：バイヤーが不在です。仕入れの目利きが完全に失われています。至急補充してください。'});
  else if(buyerAvg>=BUYER_AGE_WARN_THRESHOLD) a.push({s:'warning',m:`商品部：バイヤーの平均年齢が${buyerAvg.toFixed(0)}歳。目利きの承継が急務です。`});
  if(!state.successor) a.push({s:'critical',m:`経営：社長引退まであと${END_YEAR-state.year}年。後継者トラックが空です。育成には数年かかります。`});
  else if(state.successorLoyalty<50) a.push({s:'critical',m:`後継者の忠誠度が${state.successorLoyalty}まで低下。離脱のリスクが現実的に高まっています。厚遇するか、経営への投資を内部育成寄りに戻してください。`});
  else if(state.successorLoyalty<70) a.push({s:'warning',m:`後継者の忠誠度が${state.successorLoyalty}です。70未満だと離脱のリスクが生じ始めます。`});
  if(state.engagement<40) a.push({s:'critical',m:`エンゲージメントが${state.engagement}まで低下しています。離職がさらに増える悪循環に入るおそれがあります。外部調達偏重を見直し、内部育成に重心を戻すか、報酬水準を上げてください。`});
  else if(state.engagement<55) a.push({s:'warning',m:`エンゲージメントが${state.engagement}に低下しています。離職率が上がり始めています。`});
  const wfr=weekendFillRate();
  if(wfr<STORE_WEEKEND_FILL_THRESHOLD) a.push({s:'warning',m:`店舗運営部：土日祝の充足率が${Math.round(wfr*100)}%と目安（${Math.round(STORE_WEEKEND_FILL_THRESHOLD*100)}%）を下回っています。頭数が足りていても、現場品質・売上に影響します。柔軟な勤務制度の導入を検討してください。`});
  const es=ecState();
  if(es==='vendor') a.push({s:'warning',m:'EC・デジタル部：システムベンダ丸投げ・パッケージ依存の状態です。変化対応が遅れ、コストも高止まりしています。ジョブ型固定＋内部育成寄りの投資でこの依存から脱却できます。'});
  return a;
}
// 部門別ギャップ（④）の診断：戦略・組織設計が決まった後の需給・市場に関するもの。
function diagnoseGap(){
  const a=[];
  DEPTS.forEach(d=>{
    const g5=demandAt(d.id,END_YEAR)-supplyWithPlan(d.id)[END_YEAR-START_YEAR];
    if(g5>=3) a.push({s:'critical',m:`${d.name}：5年後に約${g5}名の不足見込み。今から複数経路で手当てが必要です。`});
    else if(g5>=1) a.push({s:'warning',m:`${d.name}：5年後に約${g5}名の不足見込み。`});
    // 内部育成・異動は人数ベースで頭打ちになり、カネを積んでも増やせない。急成長には外部調達が要る、という判断材料
    const growthNeed=demandAt(d.id,END_YEAR)-headcount(d.id);
    if(d.id!=='mgmt' && growthNeed>0 && growthNeed/Math.max(1,headcount(d.id))>=0.4){
      a.push({s:'info',m:`${d.name}：5年で現有比${Math.round(growthNeed/Math.max(1,headcount(d.id))*100)}%の急成長ペースです。内部育成・異動は人数ベースで頭打ちになるため、⑤投資配分では外部調達重視への配分を検討してください。`});
    }
    if(d.id!=='mgmt'){
      const dem=demandAt(d.id, state.year); const fillRatio=dem? headcount(d.id)/dem : 1;
      if(fillRatio<0.6){
        const isJobtype=state.orgDesign.hrArchitecture==='jobtype';
        a.push({s:'critical',m:`${d.name}：今年の充足率が${Math.round(fillRatio*100)}%と深刻です。業務が回らなければ、${isJobtype?'「ジョブ型固定」の方針に反してでも':''}緊急の人員融通が起きます（採用できないポジションは今いる人で埋めるしかありません）。`});
      }
    }
  });
  if(tight('digital')>=80) a.push({s:'warning',m:`EC・デジタル人財の採用市場が逼迫（逼迫度${Math.round(tight('digital'))}）。単一経路依存は危険。内部育成との併用を。`});
  if(state.budget<=0) a.push({s:'warning',m:'年間投資予算が枯渇しています。組織再編の管理コストや報酬水準が重すぎる可能性があります。'});
  return a;
}
function diagnose(){ return diagnosePortfolio().concat(diagnoseGap()); } // 経営フェーズ(⑤)で全体を見る用

  const annualSpend = annualTotalBudget*share/100;
  const w=allocWeights(stance); const sum=Object.values(w).reduce((a,b)=>a+b,0);
  let hires=0, cost=0;
  Object.keys(w).forEach(ch=>{
    const frac=w[ch]/sum;

      const pipelinePenalty = (ch==='develop' && dept==='store' && state.orgDesign.flexWork) ? LEADERSHIP_PIPELINE_PENALTY : 1;
      const cap=frac*BUILD_CAPACITY_MULT*engagementMult()*pipelinePenalty; hires+=cap; cost+=cap*(ch==='develop'?5:0); // 人ベース(供給元の制約)。カネでは買えない。実行(autoExecuteYear)と同じエンゲージメント補正・柔軟な勤務制度のパイプライン減速を適用し、⑤の見込みと⑥の実績を一致させる

// 結果画面の各種スコア計算。vResult()（表示）とbuildAiReport()（AI分析用テキスト）の両方から
// 参照する単一の計算元（同じロジックが2箇所でずれないようにするため）。
function computeResultScores(){
  const end=state.ending;
  // 戦略実現度：戦略が求めた各部門のYear15需要を、実際に人財で満たせたか
  const realize = DEPTS.reduce((s,d)=>s+Math.min(1, headcount(d.id)/Math.max(1,demandAt(d.id,END_YEAR))),0)/DEPTS.length;
  const stratScore = Math.round(realize*100);
  // 表示（結果画面・AI分析レポート）ではこのgapScoreをそのまま0-100で見せるため、ここで
  // クランプしてから重み付けする。以前はここをクランプせずtotalの計算に使い、表示だけ
  // clamp(gapScore,0,100)していたため、表示された内訳から総合スコアを検算すると
  // 実際の総合スコアと合わない（生のgapScoreが大きくマイナスになるほどズレが広がる）不整合があった。
  const gapScore = clamp(100 - DEPTS.reduce((s,d)=>s+Math.max(0,demandAt(d.id,END_YEAR)-headcount(d.id)),0)*6, 0, 100);
  const succScore = end==='smooth'?100:end==='rocky'?60:0;
  const engScore = clamp(state.engagement, 0, 100); // 現場を疲弊させずに経営できたか
  const total=Math.round(clamp(stratScore*0.35+gapScore*0.15+succScore*0.30+engScore*0.20,0,100));
  // ---- 経営者力量審判：3つの力による冷徹な審判。「仕組み」だけでも「人心」だけでもSは取れない ----
  const ct=state.commitTargets || {revenue:BASE_ANNUAL_REVENUE, stores:storeCountAt(END_YEAR)};
  const revRatio=state.finance.revenue/ct.revenue, storeRatio=storeCountNow()/Math.max(1,ct.stores);
  const commitScore=Math.round(clamp((revRatio*0.6+storeRatio*0.4)*100,0,100));
  const spiritScore=({aggressive:100,standard:80,pivot:90,focus:30})[state.strategy.expansion]??60;
  // 商品部の内部育成重視は「⑤投資配分を見直した最終年時点のスタンス」ではなく、
  // 5年間で実際に内部育成重視だった年数(state.cum.mdInternalYears、advanceYear()で毎年計上)の
  // 過半数(3年以上)で判定する。⑤は毎年見直せるため、最終年だけ切り替えれば満点が取れてしまう
  // 「最後だけ帳尻合わせ」を防ぎ、5年間の一貫した投資姿勢を評価する。
  const knowledgeScore=Math.round(clamp((mdSuccessionOk()?50:0)+((state.cum.mdInternalYears||0)>=3?30:0)+(state.orgDesign.concierge?20:0),0,100));
  const execScore=Math.round((commitScore+spiritScore+knowledgeScore)/3);
  let rank= total>=88?'S':total>=76?'A':total>=62?'B':total>=48?'C':'D';
  if(rank==='S' && execScore<70) rank='A'; // 仕組み(スコア)だけでなく人心(経営者力量スコア)も伴っていなければSは取れない
  const endMsg = end==='smooth'?`後継者が十分に育ち、円滑に承継できました（人事アーキテクチャ：${HR_ARCHITECTURE[state.orgDesign.hrArchitecture].name}）。`:end==='rocky'?'後継者はいたが準備不足で、承継後の経営が一時ぐらつきました。':'社長引退時に後継者が育っておらず、経営承継に失敗しました（存続危機）。';
  const stratMsg = stratScore>=85?'描いた戦略を人財で実現できました。戦略・組織・人財が整合していた証拠です。':stratScore>=60?'戦略の多くは実現できましたが、一部の部門で人財が不足しました。':'戦略に対して人財が足りず、描いた事業は実現しきれませんでした。<b>人財で実現できない戦略は絵に描いた餅</b>——次は戦略・組織設計・投資配分を最初から整合させましょう。';
  return {end, stratScore, gapScore, succScore, engScore, total, ct, commitScore, spiritScore, knowledgeScore, execScore, rank, endMsg, stratMsg};
}
// 姉妹プロダクト「企業経営シミュレーション」の「📋 経営レポートをコピー（AI分析用）」と同じ発想：
// 外部APIは呼ばず、ゲームの意思決定ログ・組織/財務データをテキスト化してクリップボードにコピーし、
// プレイヤー自身がAIチャットに貼り付けて分析させる（単一HTML・外部依存ゼロの制約を保つため）。
function buildAiReport(){
  const R=computeResultScores();
  const exp=STRATEGY_OPTIONS.expansion.find(o=>o.id===state.strategy.expansion);
  const focusNames=state.strategy.focuses.map(id=>STRATEGY_OPTIONS.focus.find(o=>o.id===id).name).join('・')||'なし';
  const elevatedNames=Object.keys(state.orgDesign.elevated).filter(k=>state.orgDesign.elevated[k]).map(k=>DEPTS.find(d=>d.id===k).name).join('・')||'なし';
  const arch=HR_ARCHITECTURE[state.orgDesign.hrArchitecture];
  const lines=[];

function copyAiReport(){
  const text=buildAiReport();
  const done=()=>alert('経営レポートをコピーしました。AIに貼り付けて分析させましょう。');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta); done();
}

// ===== 全体ポートフォリオ（会社全体の人の構成）=====
// 放置シナリオ：現在の人財を years 年ぶん進めた予測ロスター（採用ゼロ・加齢・定年・離職）。
// プレビュー用に決定論的（ゲーム乱数を消費しない）に計算する。
function projectRoster(years){
  let list=state.emps.map(e=>({...e}));
  for(let y=0;y<years;y++){
    list.forEach(e=>e.age++);
    list=list.filter(e=>e.age<65); // 定年
    const byd={}; list.forEach(e=>{(byd[e.dept]=byd[e.dept]||[]).push(e)});
    let keep=[];
    Object.keys(byd).forEach(dep=>{
      const arr=byd[dep]; const attr= dep==='store'?0.12:0.09;
      const remove=Math.round(arr.length*attr);
      arr.sort((a,b)=>a.pot-b.pot); // 定着しにくい層(低ポテンシャル)から抜ける想定で決定論化
      keep=keep.concat(arr.slice(remove));
    });
    list=keep;
  }
  return list;
}
// 「同じ方針を継続」した場合の10年後投影：projectRoster()の「採用ゼロで放置」という
// 最悪ケースとは異なり、Year15時点の投資配分方針（alloc/stance・組織設計・報酬水準）と
// 到達したエンゲージメント水準を維持したまま、autoExecuteYear()と同じ内部育成・異動・
// 役職遷移・外部採用のロジックを years 年分繰り返す。乱数は一切消費せず、外部採用の
// 成功確率(channelSuccess)も期待値として扱う（⑤投資配分のprojectDeptOutcome()と同じ考え方）。
// 「S評価＝短期5年の実行力」と「その方針のまま10年後も持続できるか」を分けて見せるための投影。
function projectContinuedPolicy(years){
  let emps=state.emps.map(e=>({...e}));
  const carry={};
  let devQueue=[];
  const engMult=engagementMult(); // エンゲージメントは最終年の水準を維持すると仮定
  const engFactor=clamp(1.6-state.engagement/100,0.6,1.6);
  const compTurnoverMult=COMP_LEVELS[state.compLevel].turnoverMult;
  const budget=state.budget; // 投資予算も維持
  const hc=(id)=>emps.filter(e=>e.dept===id).length;
  for(let y=0;y<years;y++){
    emps.forEach(e=>e.age++);
    emps=emps.filter(e=>e.age<65); // 定年
    // 離職：advanceYear()の離職率式(engFactor・報酬水準・体力的負荷)を、部門ごとの
    // 期待離職率として決定論的に適用し、低ポテンシャル層から間引く
    const byd={}; emps.forEach(e=>{(byd[e.dept]=byd[e.dept]||[]).push(e)});
    let survivors=[];
    DEPTS.forEach(d=>{
      const arr=byd[d.id]||[]; if(!arr.length) return;
      const avgStrain=avg(arr.map(e=>physicalStrainMult(e)));
      const attr=clamp((d.id==='store'?0.12:0.09)*engFactor*compTurnoverMult*avgStrain,0,0.9);
      const remove=Math.round(arr.length*attr);
      arr.sort((a,b)=>a.pot-b.pot);
      survivors=survivors.concat(arr.slice(remove));
    });
    emps=survivors;
    // 内部育成は実運用と同じlead経過後に昇格する。
    devQueue.filter(p=>p.arrive===y).forEach(p=>{
      const t=emps.find(e=>e.id===p.empId);
      if(t) completeDevelopment(t);
    });
    const projectedLiveIds=new Set(emps.map(e=>e.id));
    devQueue=devQueue.filter(p=>p.arrive>y&&projectedLiveIds.has(p.empId));
    const developmentQueuedIds=new Set(devQueue.map(p=>p.empId));
    const referralAnnualCap=referralCapFor(emps.length);
    let referralUsed=0;
    // 内部育成・異動・外部採用：autoExecuteYear()と同じ配分ロジック
    DEPTS.forEach(d=>{
      const dept=d.id; const stance=state.alloc[dept].stance;
      const annualSpend=budget*effectiveShare(dept)/100;
      const w=allocWeights(stance); const sum=Object.values(w).reduce((a,b)=>a+b,0);
      ['develop','transfer'].forEach(ch=>{
        const frac=w[ch]/sum;
        const pipelinePenalty=(ch==='develop'&&dept==='store'&&state.orgDesign.flexWork)?LEADERSHIP_PIPELINE_PENALTY:1;
        const capacity=frac*BUILD_CAPACITY_MULT*engMult*pipelinePenalty;
        const key=dept+':'+ch; const total=capacity+(carry[key]||0);
        const n=Math.floor(total); carry[key]=total-n;
        for(let i=0;i<n;i++){
          if(ch==='develop'){
            const t=emps.filter(e=>e.dept===dept&&e.grade<4&&!developmentQueuedIds.has(e.id)).sort((a,b)=>b.pot-a.pot)[0];
            if(t){
              developmentQueuedIds.add(t.id);
              devQueue.push({empId:t.id,arrive:y+CHANNELS.develop.lead});
            }
          } else {
            const from=emps.filter(e=>e.dept!==dept&&e.role!=='社長'&&!SCARCE_ROLES.includes(e.role)&&e.dept!=='mgmt'&&!developmentQueuedIds.has(e.id)).sort((a,b)=>hc(b.dept)-hc(a.dept))[0];
            if(from){ from.dept=dept; from.role=ROLE_BY_DEPT[dept]; }
          }
        }
      });
      ['newgrad','agency','headhunt','referral'].forEach(ch=>{
        const frac=w[ch]/sum; const chBudget=annualSpend*frac; const unit=channelCost(ch,dept);
        if(unit<=0) return;
        const expected=(chBudget/unit)*channelSuccess(ch,dept); // 成功確率込みの期待値（乱数を消費しない）
        const key=dept+':'+ch; const total=expected+(carry[key]||0);
        let n=Math.floor(total); carry[key]=total-n;
        if(ch==='referral'){ const capLeft=referralAnnualCap-referralUsed; n=Math.min(n,Math.max(0,capLeft)); referralUsed+=n; }
        for(let i=0;i<n;i++){
          const gender = dept==='store' ? (i%5===0?'M':'F') : (i%2===0?'M':'F');
          emps.push({id:'proj'+y+dept+ch+i, dept, role:ROLE_BY_DEPT[dept], age: ch==='newgrad'?23:35, grade: ch==='headhunt'?4:2, gender, pot:0.5});
        }
      });
    });
  }
  return emps;
}
function referralCapFor(n){return Math.max(1,Math.round(n*0.06))}
function portfolioStats(a){
  a=a||state.emps;
  const n=a.length;
  const female=a.filter(e=>e.gender==='F').length;
  const mgr=a.filter(e=>e.grade>=4);
  const femaleMgr=mgr.filter(e=>e.gender==='F').length;
  return {
    n, avgAge:avg(a.map(e=>e.age)),
    femaleRatio: n? female/n : 0,
    mgrRatio: n? mgr.length/n : 0,
    femaleMgrRatio: mgr.length? femaleMgr/mgr.length : 0,
    over55: a.filter(e=>e.age>=55).length,
    under35: a.filter(e=>e.age<35).length,
  };
}
// 2時点間の増減を色付きで見せる行（bv=起点の値、av=現在値、dir='up'なら増加が好ましい、'down'なら減少が好ましい、nullなら良し悪しなし）
function numRow(label,bv,av,unit,dir){
  const d=av-bv; const improved= dir==='down'?d<0:dir==='up'?d>0:null;
  const col= improved===null?'var(--muted)':improved?'var(--ok)':(d===0?'var(--muted)':'var(--warn)');
  const sign= d>0?'+':''; const dtxt = Number.isInteger(d)? `${sign}${d}`:`${sign}${d.toFixed(1)}`;
  return `<tr><td>${label}</td><td>${bv}${unit}</td><td>${av}${unit}</td><td><span style="color:${col}">${dtxt}${unit}</span></td></tr>`;
}
function bandMax(emps){
  const lo=[0,25,30,35,40,45,50,55,60,65], hi=[24,29,34,39,44,49,54,59,64,200];
  const c=lo.map(()=>({M:0,F:0}));
  emps.forEach(e=>{for(let i=0;i<lo.length;i++){if(e.age>=lo[i]&&e.age<=hi[i]){c[i][e.gender]++;break}}});
  return Math.max(1,...c.map(x=>Math.max(x.M,x.F)));
}
// 会社全体の平均だけでは、特定部門の高齢化・若手枯渇が隠れてしまう
// （例：店舗が若く商品部が高齢でも、平均すると"普通"に見える）。
// ③組織設計・⑤投資配分は部門ごとに判断するため、部門別の年齢構成をここで可視化する。
function deptAgeTable(){

function gradeBars(emps){
  return [5,4,3,2,1].map(g=>{const c=emps.filter(e=>e.grade===g).length;const w=emps.length?c/emps.length*100:0;
    const gname={5:'経営/幹部(G5)',4:'管理職(G4)',3:'主任/専門(G3)',2:'中堅(G2)',1:'一般/新人(G1)'}[g];

function kpiBox(l,v,sub,warn){return `<div class="box"><div class="v" ${warn?'style="color:var(--warn)"':''}>${v}</div><div class="l">${l}${sub?` <span style="opacity:.7">${sub}</span>`:''}</div></div>`}
// 放置シナリオを、数値の羅列ではなく「アナリストが書いた所見」のような複数文の分析にする。
// 総論(頭数・年齢) → 最も痛手を負う部門 → 階層(管理職)の空洞化 → 店舗の次世代店長候補 →
// 商品部バイヤーの目利き承継 → 長期(10年)シナリオ → 結論(組織は戦略に従う、の裏返し)、の順で構成。
function neglectAnalysis(hz, s, ps, proj, proj10){
  const byDept = DEPTS.filter(d=>d.id!=='mgmt').map(d=>{
    const cur=headcount(d.id), future=proj.filter(e=>e.dept===d.id).length;
    return {name:d.name, cur, future, pct: cur? Math.round((future-cur)/cur*100) : 0};
  });
  const worstDept = byDept.slice().sort((a,b)=>a.pct-b.pct)[0];
  const mgrNow = state.emps.filter(e=>e.grade>=4).length;
  const mgrProj = proj.filter(e=>e.grade>=4).length;
  const youngSMNow = state.emps.filter(e=>e.dept==='store'&&e.grade>=3&&e.age<38).length;
  const youngSMProj = proj.filter(e=>e.dept==='store'&&e.grade>=3&&e.age<38).length;
  const buyerCountNow = deptEmps('md').filter(e=>e.role==='バイヤー').length;
  const buyerCountProj = proj.filter(e=>e.dept==='md'&&e.role==='バイヤー').length;
  const buyerAvgNow = avg(deptEmps('md').filter(e=>e.role==='バイヤー').map(e=>e.age));
  const buyerAvgProj = avg(proj.filter(e=>e.dept==='md'&&e.role==='バイヤー').map(e=>e.age));
  const lines=[];
  lines.push(`何も手を打たなければ、${hz}年後には総人数が${s.n}名から<b>${ps.n}名</b>（${ps.n-s.n>=0?'+':''}${ps.n-s.n}名）へ、平均年齢は${s.avgAge.toFixed(0)}歳から<b>${ps.avgAge.toFixed(0)}歳</b>まで上がる見込みです。`);
  if(worstDept && worstDept.pct<0){
    lines.push(`とりわけ<b>${worstDept.name}</b>の目減りが顕著で、現有${worstDept.cur}名 → ${worstDept.future}名（${worstDept.pct}%）まで縮小する見込みです。`);
  }
  lines.push(`階層面では、管理職（等級4以上）が${mgrNow}名 → ${mgrProj}名${mgrNow>mgrProj?`へと<b>${mgrNow-mgrProj}名減少</b>し、意思決定を支える層が薄くなります`:'とほぼ維持され、階層構造への影響は限定的です'}。`);
  if(youngSMNow<=2){
    lines.push(`店舗運営部の38歳未満・店長候補は現在<b>${youngSMNow}名</b>しかおらず、${hz}年後も${youngSMProj}名の見込み——出店計画を支える次世代の店長が育っていません。`);
  }
  if(buyerCountProj===0){
    lines.push(`商品部のバイヤーは${hz}年後に<b>0名</b>になる見込みです——高齢化どころか、仕入れの目利きそのものが消失します。`);
  } else if(buyerAvgNow>=BUYER_AGE_WARN_THRESHOLD-5){ // 放置シナリオは早期警戒目的のため通常閾値よりやや早めに言及する
    lines.push(`商品部のバイヤーは平均<b>${buyerAvgNow.toFixed(0)}歳</b>。${hz}年後には平均${buyerAvgProj?buyerAvgProj.toFixed(0):'—'}歳に達し、目利きの承継が一段と切迫します。`);
  }
  lines.push(proj10.n<s.n*0.7
    ? `このペースを10年続ければ、総人数は<b>${proj10.n}名</b>・平均<b>${proj10.avgAge.toFixed(0)}歳</b>まで縮小し、組織として立ち行かなくなります。`
    : `10年放置しても総人数の急激な縮小は避けられますが、高齢化・中堅空洞化という質的な劣化は着実に進みます。`);
  lines.push(`<b>組織は戦略に従う</b>——裏を返せば、支える組織構造がなければどんな戦略も絵に描いた餅です。次の②組織設計・⑤投資配分は、この放置シナリオをどこまで押し返せるかの勝負になります。`);
  return lines;
}

function svgPyramid(emps, maxOverride){
  emps=emps||state.emps;
  const bands=['～24','25-29','30-34','35-39','40-44','45-49','50-54','55-59','60-64','65～'];
  const lo=[0,25,30,35,40,45,50,55,60,65], hi=[24,29,34,39,44,49,54,59,64,200];
  const cnt=bands.map((_,i)=>({M:0,F:0}));
  emps.forEach(e=>{for(let i=0;i<bands.length;i++){if(e.age>=lo[i]&&e.age<=hi[i]){cnt[i][e.gender]++;break}}});
  const maxV=maxOverride||Math.max(1,...cnt.map(c=>Math.max(c.M,c.F)));
  const W=440,H=250,cx=W/2,pad=8,bandH=(H-24)/bands.length, scale=(cx-46)/maxV;
  let sv=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="人員ピラミッド">`;
  sv+=`<line x1="${cx}" y1="4" x2="${cx}" y2="${H-16}" stroke="var(--line)"/>`;
  cnt.forEach((c,i)=>{
    const y=6+i*bandH, h=bandH*0.72;
    sv+=`<rect x="${cx-c.M*scale}" y="${y}" width="${c.M*scale}" height="${h}" rx="2" fill="var(--chart-a)"/>`;
    sv+=`<rect x="${cx}" y="${y}" width="${c.F*scale}" height="${h}" rx="2" fill="var(--chart-b)"/>`;
    sv+=`<text x="${cx}" y="${y+h-2}" fill="var(--muted)" font-size="9" text-anchor="middle" dy="-1">${bands[i]}</text>`;
    if(c.M)sv+=`<text x="${cx-c.M*scale-3}" y="${y+h*0.75}" fill="var(--muted)" font-size="9" text-anchor="end">${c.M}</text>`;
    if(c.F)sv+=`<text x="${cx+c.F*scale+3}" y="${y+h*0.75}" fill="var(--muted)" font-size="9">${c.F}</text>`;
  });
  sv+=`</svg>`; return sv;
}
function svgGap(d){
  const W=440,H=220,pad=34;
  const dem=state.demand[d], sup=supplyWithPlan(d);
  const maxV=Math.max(...dem,...sup, 5)*1.15;
  const x=i=>pad+ i*( (W-pad-10)/(dem.length-1) );
  const y=v=>H-pad - v/maxV*(H-pad-14);
  const line=(arr,col)=>`<path d="${arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>`+
    arr.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${col}"/>`).join('');
  // gap面(需要>供給の差)
  const area=`<path d="${dem.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')} ${sup.slice().reverse().map((v,i)=>'L'+x(sup.length-1-i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')} Z" fill="rgba(240,87,107,.14)"/>`;
  const gy=[0,Math.round(maxV/2),Math.round(maxV)];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="需給ギャップ">
    ${gy.map(v=>`<line x1="${pad}" y1="${y(v)}" x2="${W-10}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" fill="var(--muted)" font-size="10">${v}</text>`).join('')}
    ${dem.map((_,i)=>`<text x="${x(i)}" y="${H-pad+14}" fill="var(--muted)" font-size="10" text-anchor="middle">Y${START_YEAR+i}</text>`).join('')}
    ${area}
    ${line(sup,'var(--chart-b)')}
    ${line(dem,'var(--chart-a)')}
  </svg>`;
}

/* ============================ EVENTS ============================ */
function bind(){
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{state.strategy.expansion=b.dataset.exp;state.demand=computeDemand(state.strategy,state.orgDesign);render()});
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{toggleFocus(b.dataset.focus)});
  document.querySelectorAll('[data-elevate-dept]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.elevateDept; state.orgDesign.elevated[d]=!state.orgDesign.elevated[d];
    state.demand=computeDemand(state.strategy,state.orgDesign); recomputeBudget(); render();
  });
  document.querySelectorAll('[data-hrarch]').forEach(b=>b.onclick=()=>{state.orgDesign.hrArchitecture=b.dataset.hrarch;render()});
  document.querySelectorAll('[data-lever]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.lever; state.orgDesign[k]=!state.orgDesign[k]; recomputeBudget(); render();
  });
  document.querySelectorAll('[data-invlvl]').forEach(b=>b.onclick=()=>{state.investLevel=b.dataset.invlvl;recomputeBudget();render()});
  document.querySelectorAll('[data-complvl]').forEach(b=>b.onclick=()=>{state.compLevel=b.dataset.complvl;recomputeBudget();render()});
  document.querySelectorAll('[data-share-dept]').forEach(b=>b.onclick=()=>{
    const dep=b.dataset.shareDept, dl=+b.dataset.delta;
    state.alloc[dep].share=clamp(state.alloc[dep].share+dl,0,100); render();
  });
  document.querySelectorAll('[data-stance-set-dept]').forEach(b=>b.onclick=()=>{
    state.alloc[b.dataset.stanceSetDept].stance=+b.dataset.value; render();
  });
  document.querySelectorAll('[data-dept]').forEach(b=>b.onclick=()=>{state.selDept=b.dataset.dept;render()});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  const cni=document.getElementById('companyNameInput');
  if(cni) cni.oninput=()=>{draftCompanyName=cni.value}; // render()を呼ばず変数だけ同期し、入力中のカーソル位置を保つ
}
function toggleFocus(id){
  const f=state.strategy.focuses; const i=f.indexOf(id);
  if(i>=0) f.splice(i,1); else { if(f.length>=2){state.log=['重点事業は最大2つまで'];} else f.push(id); }
  state.demand=computeDemand(state.strategy,state.orgDesign); render();
}
function act(a){
  if(a==='restart'){state=undefined;render();return}
  if(a==='copyReport'){copyAiReport();return}
  if(a==='start'){newGame();state.companyName=draftCompanyName.trim()||'株式会社サンプルマート';state.phase='strategy';render();return}
  if(a==='toPortfolio'){state.phase='portfolio';render();return}
  if(a==='backStrategy'){state.phase='strategy';render();return}
  if(a==='backPortfolio'){state.phase='portfolio';render();return}
  if(a==='toOrgDesign'){
    // 戦略で選ばれなくなった重点事業の組織再編フラグは無効化する
    const validDepts=new Set(state.strategy.focuses.map(f=>FOCUS_TO_DEPT[f]));
    Object.keys(state.orgDesign.elevated).forEach(k=>{ if(!validDepts.has(k)) delete state.orgDesign.elevated[k]; });
    state.demand=computeDemand(state.strategy,state.orgDesign); recomputeBudget();
    state.phase='orgdesign';render();return;
  }
  if(a==='backOrgDesign'){state.phase='orgdesign';render();return}
  if(a==='toGap'){state.phase='gap';render();return}
  if(a==='backGap'){state.phase='gap';render();return}
  if(a==='toInvest'){state.phase='invest';render();return}
  if(a==='commitPlan'){
    // この時点の投資配分方針を「意図」としてスナップショットし、結果画面で実績と比較する
    if(!state.planSnapshot){
      const hz=horizonYears();
      let totalHires=0;
      DEPTS.forEach(d=>{const p=projectDeptOutcome(d.id,effectiveShare(d.id),state.alloc[d.id].stance,state.budget);
        totalHires+=p.expectedHires*hz;});
      state.planSnapshot={totalHires:Math.round(totalHires*10)/10};
    }
    // 期首に掲げた「約束」（年商・出店目標）を固定する。①約束する力の判定基準になる
    if(!state.commitTargets) state.commitTargets=computeCommitTargets();
    state.phase='year';render();return;
  }
  if(a==='advance'){advanceYear();render();return}
  if(a.startsWith('nominate:')){
    const target=a.slice('nominate:'.length);
    if(target==='external'){
      // 外部招聘：社歴不問でいつでも候補を用意できる代わりに、忠誠度は低く始まる(build/buyと同じ構造)
      const gender=rng()<.5?'M':'F';
      const ext={id:'e'+Math.floor(rng()*99999),dept:'mgmt',role:'外部招聘幹部',age:ri(38,50),grade:4,gender,pot:+(0.5+rng()*0.4).toFixed(2),name:name(gender)};
      state.emps.push(ext);
      state.successor=ext.id; state.succProgress=25; state.successorLoyalty=35+Math.round(rng()*15);
      state.log.push(`外部から${ext.name}を後継者候補として招聘しました（社歴ゼロのため忠誠度は低め。関係構築が必要です）`);
    } else {
      const cand=state.emps.find(e=>e.id===target && e.grade>=4 && e.role!=='社長');
      if(cand){
        const fromDept=DEPTS.find(d=>d.id===cand.dept).name;
        cand.dept='mgmt'; cand.role='後継者候補'; // 経営を学ばせるため元の部門から引き抜く＝元の部門の人員・後継体制が薄くなるという現実の代償を伴う
        state.successor=cand.id; state.succProgress=10; state.successorLoyalty=60+Math.round(rng()*20);
        state.log.push(`${cand.name}を${fromDept}から引き抜き、後継者に指名しました（元の部門の人員が1名減ります）`);
      }
    }
    render(); return;
  }
  // 人心掌握アクション：年1回まで。社長個人の人心掌握度を上げ、エンゲージメントの目減りを緩和する
  // （エンゲージメントを通じて現場の実行成功率を左右する）
  if(a==='townhall'){
    if(state.charismaActionUsed) return;
    state.engagement=Math.round(clamp(state.engagement+10,5,95));
    state.charisma=Math.round(clamp(state.charisma+15,0,100));
    state.charismaActionUsed=true;
    state.log.push('車座のタウンミーティングを実施：現場を回り、方針の「理由」を自分の言葉で伝えました。');
    render(); return;
  }
  if(a==='praise'){
    if(state.charismaActionUsed) return;
    state.praiseBoost=true;
    state.charisma=Math.round(clamp(state.charisma+10,0,100));
    state.charismaActionUsed=true;
    state.log.push('大々的な表彰制度で現場の成果を称え、アニマルスピリットを刺激しました（今年の店舗運営品質に一時バフ）。');
    render(); return;
  }
  if(a==='sashi'){
    if(state.charismaActionUsed || !state.successor) return;
    state.successorBoosted=true;
    state.charisma=Math.round(clamp(state.charisma+5,0,100));
    state.charismaActionUsed=true;
    state.log.push('後継者とサシで向き合い、個別に厚遇・慰留しました（来年の忠誠度に大きく反映されます）。');
    render(); return;
  }
  // ジョブローテーション型・バランス型の経営者が、重点事業を強化するために能動的に行う計画的配転。
  // 部門間ミスマッチへの受動的なリスキリングとは異なり、方針に沿った異動のため即時反映・等級維持・
  // エンゲージメントへの悪影響なし。年1回まで。
  if(a.startsWith('plannedTransfer:')){
    if(state.plannedTransferUsed) return;
    const [,from,to]=a.split(':');
    const cand=state.emps.filter(e=>e.dept===from&&e.role!=='社長'&&!SCARCE_ROLES.includes(e.role)&&e.id!==state.successor).sort((x,y)=>y.pot-x.pot)[0];
    if(cand){
      cand.dept=to; cand.role=ROLE_BY_DEPT[to];
      state.actual[to]=(state.actual[to]||0)+1;
      state.plannedTransferUsed=true;
      state.log.push(`${DEPTS.find(d=>d.id===from).name}から${DEPTS.find(d=>d.id===to).name}へ、重点事業強化のため計画的に1名を配転しました。`);
    }
    render(); return;
  }
  // 戦略転換（店舗縮小×EC急伸等）で生まれた「余剰部門→不足部門」のミスマッチへの経営者の直接対応。
  // 現場の自動執行(採用チャネル)とは別枠：頭数の増減を経営者自身が判断する例外的なアクション。
  if(a.startsWith('reskill:')){
    const [,from,to]=a.split(':');
    const cand=state.emps.filter(e=>e.dept===from&&e.role!=='社長'&&!SCARCE_ROLES.includes(e.role)&&e.id!==state.successor).sort((x,y)=>y.pot-x.pot)[0];
    if(cand){
      state.emps=state.emps.filter(e=>e.id!==cand.id);
      state.pending.push({dept:to,role:ROLE_BY_DEPT[to],arrive:state.year+1,age:cand.age,grade:Math.max(1,cand.grade-1),gender:cand.gender});
      state.engagement=Math.round(clamp(state.engagement+2,5,95)); // 自発的な再配置は雇用不安を和らげる
      state.log.push(`${DEPTS.find(d=>d.id===from).name}から${DEPTS.find(d=>d.id===to).name}へ1名がリスキリング異動（来年配属）`);
    }
    render(); return;
  }
  if(a.startsWith('restructure:')){
    const from=a.split(':')[1];
    const targets=state.emps.filter(e=>e.dept===from&&e.role!=='社長'&&e.id!==state.successor).sort((x,y)=>x.pot-y.pot).slice(0,2);
    if(targets.length){
      const ids=new Set(targets.map(t=>t.id));
      state.emps=state.emps.filter(e=>!ids.has(e.id));
      state.engagement=Math.round(clamp(state.engagement-20,5,95)); // 即時削減の代償：エンゲージメントが大きく悪化(→後継者忠誠度にも波及)
      state.restructureShockYears=2;
      state.cum.restructured=(state.cum.restructured||0)+targets.length;
      state.log.push(`${DEPTS.find(d=>d.id===from).name}でリストラを実施：${targets.length}名が退職。エンゲージメントが大きく悪化しました。`);
    }
    render(); return;
  }
}

render();
</script>
