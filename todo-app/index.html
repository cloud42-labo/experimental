<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoメモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>ToDoメモ</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="やることを入力..." autocomplete="off">
      <button type="submit">追加</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty-message">タスクはありません</p>
    <button type="button" id="clear-completed-btn">完了済みを削除</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
